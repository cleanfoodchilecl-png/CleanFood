function toast(t, ms = 3200) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), ms); }
function cargando(on, txt) {

async function api(accion, datos = {}, opt = {}) {
  if (!API || API.indexOf('PEGA_AQUI') >= 0) throw new Error('Falta configurar el enlace del sistema en config.js');
  if (!opt.mudo) cargando(true, opt.txt);
  try {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion, token: S && S.token, ...datos }), redirect: 'follow' });
    const j = await res.json();
    if (!j.ok) {
      if (j.error === 'SESION') { salir(true); throw new Error('Tu sesión expiró. Vuelve a entrar.'); }
      const e = new Error(j.error); e.servidor = true; throw e;
    }
    return j.data;
  } catch (e) {
    if (!e.servidor && !/sesión/.test(e.message) && !/config\.js/.test(e.message)) e.red = true;
    throw e;
  } finally { if (!opt.mudo) cargando(false); }
}

/* Cola sin señal: recepciones, salidas y formularios se guardan en el teléfono y se envían solos. */
const cola = { get: () => ls.get('cola', []), set: c => { ls.set('cola', c); pintarCola(); } };
async function enviarOEncolar(accion, datos, desc) {
  datos.uid = datos.uid || uid();
  try { return await api(accion, datos, { txt: 'Enviando…' }); }
  catch (e) {
    if (!e.red) throw e;
    const c = cola.get(); c.push({ accion, datos, desc, t: Date.now() }); cola.set(c);
    return { enCola: true };
  }
}
let enviando = false;
async function vaciarCola() {
  if (enviando || !S) return; const c = cola.get(); if (!c.length) return;
  enviando = true; const quedan = [];
  for (const x of c) {
    try { const r = await api(x.accion, x.datos, { mudo: true }); if (r && r.stock) S.stock = r.stock; }
    catch (e) { if (e.red) quedan.push(x); else { quedan.push({ ...x, error: e.message }); } }
  }
  enviando = false; cola.set(quedan);
  if (c.length > quedan.length) toast('✅ Se enviaron ' + (c.length - quedan.length) + ' registros guardados sin señal');
}
function pintarCola() {
  const el = $('#colaBar'); if (!el) return; const c = cola.get();
  el.classList.toggle('oculto', !c.length);
  el.textContent = c.some(x => x.error) ? '⚠ Hay registros con error sin enviar. Toca para ver.' : '📶 ' + c.length + ' registro(s) guardados en el teléfono. Se enviarán con señal (toca para reintentar).';
}
window.addEventListener('online', vaciarCola);
setInterval(vaciarCola, 60000);

/* Lectura del XML de la factura electrónica del SII (DTE) */
$('#xmlFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const txt = await leerTextoXML(file);
    const dte = parsearDTE(txt);
    leerCabecera();
    Object.assign(REC.cab, { proveedor: dte.prov, rut: dte.rut, tipo: dte.tipo, folio: dte.folio, fecha: dte.fecha || REC.cab.fecha, monto: dte.monto, iec: dte.iec || '' });
    REC.items = REC.items.filter(i => i.c || i.cant).concat(dte.items.map(x => emparejar(x, dte.rut)));
    ls.set('rec_borrador', REC); recepcion();
    const sinProd = REC.items.filter(i => !i.c).length;
    toast(`📄 ${dte.items.length} productos leídos de la ${dte.tipo.toLowerCase()} ${dte.folio}` + (sinProd ? `. Asigna ${sinProd} producto(s) sin emparejar.` : ''), 5000);
  } catch (err) { toast('No se pudo leer el XML: ' + err.message, 5000); }
});
async function leerTextoXML(file) {
  const buf = await file.arrayBuffer();
  const cab = new TextDecoder('ascii').decode(buf.slice(0, 200));
  const enc = /encoding=["']([\w-]+)/i.exec(cab);
  try { return new TextDecoder(enc ? enc[1] : 'utf-8').decode(buf); } catch (e) { return new TextDecoder('iso-8859-1').decode(buf); }
}
function parsearDTE(txt) {
  const doc = new DOMParser().parseFromString(txt, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('el archivo no es un XML válido');
  const t = (el, n) => { const x = el.getElementsByTagNameNS('*', n)[0] || el.getElementsByTagName(n)[0]; return x ? x.textContent.trim() : ''; };
  const docs = [...doc.getElementsByTagNameNS('*', 'Documento')].concat(doc.getElementsByTagNameNS('*', 'Documento').length ? [] : [...doc.getElementsByTagName('Documento')]);
  const D = docs[0]; if (!D) throw new Error('no se encontró un documento tributario (DTE)');
  const tipos = { 33: 'Factura', 34: 'Factura', 46: 'Factura', 52: 'Guía de despacho', 39: 'Boleta', 41: 'Boleta', 56: 'Factura', 61: 'Factura' };
  const tipoN = t(D, 'TipoDTE');
  if (tipoN === '61') toast('⚠ Este XML es una nota de crédito: revisa antes de ingresar', 5000);
  const items = [...D.getElementsByTagNameNS('*', 'Detalle')].map(d => {
    const q = Number(t(d, 'QtyItem')) || 1, monto = Number(t(d, 'MontoItem')) || 0;
    const pr = Number(t(d, 'PrcItem')) || (monto && q ? monto / q : 0);
    return { nf: t(d, 'NmbItem') || t(d, 'DscItem'), qf: q, uf: t(d, 'UnmdItem'), pf: Math.round(pr), cod: t(d, 'VlrCodigo') };
  }).filter(x => x.nf);
  const ret = [...D.getElementsByTagNameNS('*', 'ImptoReten')].map(r => ({ tipo: t(r, 'TipoImp'), m: Number(t(r, 'MontoImp')) || 0 })); // 19 = anticipo harina; 28 y 35 = impuesto específico combustible
  const iec = ret.filter(r => ['28', '35'].includes(r.tipo)).reduce((a, r) => a + r.m, 0), harina = ret.some(r => r.tipo === '19');
  if (harina) items.forEach(x => { if (/HARINA/i.test(x.nf)) x.harina = true; });
  return { tipo: tipos[tipoN] || 'Factura', folio: t(D, 'Folio'), fecha: t(D, 'FchEmis'), rut: t(D, 'RUTEmisor'), prov: t(D, 'RznSoc') || t(D, 'RznSocEmisor'), monto: t(D, 'MntTotal'), items, iec };
}
const norm = s => String(s || '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
const normRut = r => { const x = String(r || '').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); return /^[0-9.\-\sK]+$/.test(x) ? x.replace(/[^0-9K]/g, '') : x.replace(/[^A-Z0-9]/g, ''); };
function emparejar(x, rut) {
  const it = { ...x, cant: x.qf, costo: x.pf || '', f: 1, c: '' };
  const n = norm(x.nf), al = S.alias || [];
  const a = al.find(a => a.n === n && a.rut === normRut(rut)) || al.find(a => a.n === n);
  if (a && (S.productos || []).some(p => p.c === a.c)) { it.c = a.c; it.f = a.f || 1; it.cant = Math.round(x.qf * it.f * 1000) / 1000; it.costo = x.pf ? Math.round(x.pf / it.f) : ''; return it; }
  // sugerencia por palabras en común
  const pal = s => norm(s).split(/[^A-Z0-9]+/).filter(w => w.length > 2 && !/^\d+$/.test(w));
  const w = pal(x.nf); let mejor = null, pts = 0;
  (S.productos || []).forEach(p => { const pw = pal(p.n); const c = pw.filter(k => w.some(z => z.startsWith(k) || k.startsWith(z))).length / Math.max(pw.length, 1); if (c > pts) { pts = c; mejor = p; } });
  if (mejor && pts >= .5) { it.c = mejor.c; it.sug = true; }
  const pf = it.c && (S.productos || []).find(p => p.c === it.c), g = pf && (pf.dren || pf.cont); // formato: unidades de factura → kg
  if (g && /^(kg|kilo)/i.test(pf.u) && it.f === 1 && !/^(kg|kilo)/i.test(x.uf || '')) { it.f = g / 1000; it.cant = Math.round(x.qf * it.f * 1000) / 1000; it.costo = x.pf ? Math.round(x.pf / it.f) : ''; }
  return it;
}

async function guardarRecepcion() {
  leerCabecera();
  const items = REC.items.filter(i => i.c && Number(i.cant) > 0);
  const sinProd = REC.items.filter(i => !i.c && (i.nf || i.cant)).length;
  if (sinProd) return toast(`Hay ${sinProd} línea(s) sin producto asignado. Asígnalo o quítalas.`, 4500);
  if (!items.length) return toast('Agrega al menos un producto');
  if (!REC.preOk) return toast('Primero completa la revisión antes de recibir (paso 0)');
  if (REC.check.some(x => !x)) return toast('Completa el checklist de recepción');
  if (!REC.cab.proveedor) return toast('Escribe el proveedor');
  const frios = items.some(i => /Refrig|Congel/.test(((S.productos || []).find(p => p.c === i.c) || {}).alm || ''));
  if (frios && REC.cab.temp === '' && !confirm('Hay productos refrigerados y no registraste la temperatura. ¿Continuar igual?')) return;
  const perecible = items.filter(i => !i.rechazado && !i.venc && /Refrig|Congel|Lácteo|Carne/.test(JSON.stringify((S.productos || []).find(p => p.c === i.c) || {})));
  if (perecible.length && !confirm(perecible.length + ' producto(s) perecibles sin fecha de vencimiento. ¿Continuar igual?')) return;
  const datos = {
    uid: REC.uid || (REC.uid = uid()), cab: REC.cab, fotos: FOTOS.rec || [],
    checklist: (S.checkPreRecepcion || []).map((c, k) => ({ t: 'Antes de recibir: ' + c.t, ok: c.ok, r: (REC.pre || [])[k] })).concat(S.checkRecepcion.map((c, k) => ({ t: c.t, ok: c.ok, r: REC.check[k] }))),
    items: items.map(i => ({ c: i.c, cant: Number(i.cant), venc: i.venc, lote: i.lote, costo: i.costo && REC.cab.tipo === 'Boleta' ? Math.round(Number(i.costo) / 1.19) : i.costo, rechazado: i.rechazado, motivo: i.motivo, nf: i.nf })),
    alias: items.filter(i => i.nf).map(i => ({ n: i.nf, c: i.c, f: Number(i.f) || 1 }))
  };
  try {
    const r = await enviarOEncolar('recepcion', datos, 'Recepción ' + (REC.cab.proveedor || '') + ' ' + (REC.cab.folio || ''));
    if (!r.enCola) {
      S.stock = r.stock;
      (datos.alias || []).forEach(a => { const n = norm(a.n); S.alias = (S.alias || []).filter(x => !(x.n === n && x.rut === normRut(REC.cab.rut))); S.alias.push({ n, rut: normRut(REC.cab.rut), c: a.c, f: a.f }); });
    }
    if (r.proveedores) S.proveedores = r.proveedores;
    else if (REC.cab.proveedor) { // sin señal o versión antigua: se recuerda igual en el teléfono
      const L = S.proveedores = S.proveedores || [], k = L.find(p => (REC.cab.rut && p.rut && normRut(p.rut) === normRut(REC.cab.rut)) || norm(p.nombre) === norm(REC.cab.proveedor));
      if (k) { if (!k.rut && REC.cab.rut) k.rut = REC.cab.rut; } else L.push({ rut: REC.cab.rut || '', nombre: REC.cab.proveedor, contacto: '', productos: '', pedido: '', llegada: '' });
    }
    prepararListas();
    REC = null; ls.del('rec_borrador'); FOTOS.rec = [];
    if (r.enCola) { ls.set('sesion', S); return modal(`<h3>📶 Guardada en el teléfono</h3><p>Se ingresará a bodega cuando vuelva la señal.</p><button class="btn full" onclick="cerrarModal();pila=[];inicio()">Listo</button>`); }
    ls.set('sesion', S);
    modal(`<h3>${r.resultado === 'Aceptada' ? '✅' : '⚠️'} Recepción ${h(r.resultado.toLowerCase())}</h3><p class="muted">${h(r.id)}</p>${r.observaciones.length ? '<div class="aviso">' + r.observaciones.map(h).join('<br>') + '</div>' : ''}<p>El stock ya está actualizado.</p><div class="row"><button class="btn sec" onclick="cerrarModal();pila=[[inicio,[]]];ir(stockVista)">Ver stock</button><button class="btn" onclick="cerrarModal();pila=[];inicio()">Listo</button></div>`);
  } catch (e) { toast(e.message, 5000); }
}

      <p class="muted" style="font-size:12.5px;margin:10px 0 0">Para fiambres y quesos laminados (jamón, queso): cómo se ajusta la cortadora para que todos corten igual y no haya merma.</p>

/* ═════════════════════ Salidas y traspasos ═════════════════════ */
let SAL = null;
function salida(modo) {
  const tras = modo === 'traspaso';
  if (!SAL || SAL.modo !== modo) SAL = { modo, items: [{ c: '', cant: '' }], bodega: bodegaActual() };
  const otras = S.config.bodegas;
  pantalla(tras ? 'Traspaso entre bodegas' : 'Salida de bodega', `
  <div class="card">
    <div id="s_marca">${marcaBodega(SAL.bodega)}</div>${S.config.bodegas.length > 1 ? `<label class="l">${tras ? 'Desde' : 'Bodega'}</label>` : ''}${bodegaSel('s_bodega', SAL.bodega)}
    ${tras ? `<label class="l">Hacia</label>${selectHTML('s_hacia', otras, SAL.hacia || otras.find(b => b !== SAL.bodega))}`
      : `<label class="l">Motivo</label>${selectHTML('s_motivo', S.config.motivos.filter(m => !/Traspaso/i.test(m)), SAL.motivo)}
         <label class="l">Destino / servicio</label>${selectHTML('s_destino', S.config.servicios, SAL.destino)}`}<div id="s_mdest" style="margin-top:10px">${marcaBodega(SAL.destino)}</div>
  </div>
  <div class="card"><h3>Productos</h3><div id="sitems"></div><div class="row"><button class="btn sec" onclick="leerSal();SAL.items.push({c:'',cant:''});pintarSal()">+ Agregar producto</button><button class="btn gris" onclick="salidaExcel()">📥 Cargar desde Excel</button></div><p class="muted" style="font-size:12.5px;margin:6px 0 0">Excel con columnas <b>Producto</b> (nombre o código) y <b>Cantidad</b>.</p></div>
  <div class="card"><label class="l" style="margin-top:0">Observación <small>(opcional)</small></label><input id="s_obs" value="${h(SAL.obs || '')}"></div>`,
    { barra: `<button class="btn" onclick="guardarSalida()">${tras ? 'Registrar traspaso' : 'Registrar salida'}</button>` });
  if ($('#s_destino')) $('#s_destino').addEventListener('change', e => $('#s_mdest').innerHTML = marcaBodega(e.target.value));
  $('#s_bodega').onchange = () => { leerSal(); $('#s_marca').innerHTML = marcaBodega(SAL.bodega); setTimeout(pintarSal, 0); };
  pintarSal();
}
function stockDe(b, c) { return (S.stock || []).find(s => s.b === b && s.c === c); }
function pintarSal() {
  const b = $('#s_bodega').value;
  $('#sitems').innerHTML = SAL.items.map((it, i) => {
    const p = (S.productos || []).find(x => x.c === it.c), s = p && stockDe(b, p.c);
    const mas = s && Number(it.cant) > s.stock;
    return `<div class="item" data-i="${i}"><div class="row"><div style="flex:3"><input class="s_prod" list="dl-prod" placeholder="Buscar producto…" value="${h(etiquetaProd(p))}" onchange="prodSal(${i},this)"></div><button class="x" onclick="leerSal();SAL.items.splice(${i},1);pintarSal()">✕</button></div>
      <div class="row" style="margin-top:6px;align-items:center"><input class="s_cant" type="number" inputmode="decimal" step="any" placeholder="Cantidad" value="${h(it.cant)}" oninput="leerSal()"><div class="muted" style="font-size:13.5px">${p ? h(p.u) + ' · hay <b>' + n0(s ? s.stock : 0) + '</b>' + (s && s.venc ? '<br>sale primero lo que vence ' + fFecha(s.venc) : '') : ''}</div></div>
      ${mas ? '<div class="aviso" style="margin-bottom:0">La cantidad es mayor al stock registrado. Se guardará igual y se avisará para revisar.</div>' : ''}</div>`;
  }).join('');
}
function leerSal() {
  if (!$('#s_bodega')) return;
  SAL.bodega = $('#s_bodega').value; ls.set('bodega', SAL.bodega);
  if ($('#s_hacia')) SAL.hacia = $('#s_hacia').value;
  if ($('#s_motivo')) { SAL.motivo = $('#s_motivo').value; SAL.destino = $('#s_destino').value; }
  SAL.obs = $('#s_obs') ? $('#s_obs').value : '';
  $$('#sitems .item').forEach(el => { SAL.items[el.dataset.i].cant = $('.s_cant', el).value; });
}
function prodSal(i, inp) { leerSal(); const p = prodDe(inp.value); if (!p) { toast('Elige un producto de la lista'); inp.value = ''; return; } SAL.items[i].c = p.c; setTimeout(() => { pintarSal(); $$('.s_cant')[i].focus(); }, 0); }
async function guardarSalida() {
  leerSal();
  const items = SAL.items.filter(i => i.c && Number(i.cant) > 0).map(i => ({ c: i.c, cant: Number(i.cant) }));
  if (!items.length) return toast('Agrega productos con cantidad');
  const tras = SAL.modo === 'traspaso';
  if (tras && SAL.hacia === SAL.bodega) return toast('El origen y el destino son la misma bodega');
  if (!tras && (!SAL.motivo || !SAL.destino)) return toast('Elige motivo y destino');
  const datos = { uid: SAL.uid || (SAL.uid = uid()), bodega: SAL.bodega, items, obs: SAL.obs, ...(tras ? { hacia: SAL.hacia } : { motivo: SAL.motivo, destino: SAL.destino }) };
  try {
    const r = await enviarOEncolar('salida', datos, (tras ? 'Traspaso a ' + SAL.hacia : 'Salida ' + SAL.motivo) + ' (' + items.length + ' productos)');
    if (r.enCola) { SAL = null; return modal(`<h3>📶 Guardada en el teléfono</h3><p>Se registrará cuando vuelva la señal.</p><button class="btn full" onclick="cerrarModal();pila=[];inicio()">Listo</button>`); }
    S.stock = r.stock; ls.set('sesion', S);
    const bajos = r.stock.filter(s => s.b === SAL.bodega && items.some(i => i.c === s.c) && (s.estado === 'Bajo mínimo' || s.estado === 'Sin stock'));
    SAL = null;
    modal(`<h3>✅ ${tras ? 'Traspaso registrado' : 'Salida registrada'}</h3><p class="muted">${h(r.id)}</p>${r.avisos.length ? '<div class="aviso">' + r.avisos.map(h).join('<br>') + '</div>' : ''}${bajos.length ? '<div class="aviso r"><b>Quedó bajo el mínimo:</b><br>' + bajos.map(s => h(s.n) + ': ' + n0(s.stock) + ' ' + h(s.u)).join('<br>') + '</div>' : ''}<div class="row"><button class="btn sec" onclick="cerrarModal();salida('${tras ? 'traspaso' : ''}')">Otra ${tras ? 'transferencia' : 'salida'}</button><button class="btn" onclick="cerrarModal();pila=[];inicio()">Listo</button></div>`);
  } catch (e) { toast(e.message, 5000); }
}

/* ═════════════════════ Stock en línea ═════════════════════ */
const EST = { 'Agotado': 'b-g', 'OK': 'b-ok', 'Vence pronto': 'b-a', 'Bajo mínimo': 'b-a', 'Sin stock': 'b-r', 'Vencido': 'b-r' };
let FS = { b: '', q: '', cat: '', est: '' };
async function stockVista(recargar = true) {
  if (!S.config.bodegas.includes(FS.b)) FS.b = bodegaActual();
  pantalla('Stock en línea', `
  <div class="filtros">${bodegaSel('st_b', FS.b)}<input id="st_q" placeholder="🔎 Buscar" value="${h(FS.q)}"></div>
  <div class="filtros">${selectHTML('st_cat', S.categorias, FS.cat, 'Todas las categorías')}${selectHTML('st_est', ['Alertas (todas)', 'Vencido', 'Vence pronto', 'Bajo mínimo', 'Sin stock', 'Agotado', 'OK'], FS.est, 'Todos los estados')}</div>
  <div id="recientes"></div><div id="st_marca"></div><div id="st_kpi"></div><div class="card lista" id="st_lista"><p class="muted">Cargando…</p></div>`,
    { barra: `<button class="btn gris" onclick="stockVista(true)">↻ Actualizar</button><button class="btn" onclick="ir(salida,'')">📤 Salida</button>` });
  ['st_b', 'st_q', 'st_cat', 'st_est'].forEach(id => $('#' + id).addEventListener('input', () => { FS = { b: $('#st_b').value, q: $('#st_q').value, cat: $('#st_cat').value, est: $('#st_est').value }; ls.set('bodega', FS.b); pintarStock(); }));
  if (S.stock) pintarStock();
  recientesHTML();
  if (recargar) { try { S.stock = await api('stock', {}, { mudo: !!S.stock }); ls.set('sesion', S); pintarStock(); } catch (e) { toast(e.red ? 'Sin señal: stock guardado de la última vez' : e.message); } }
}
function pintarStock() {
  if (!$('#st_lista')) return;
  const q = norm(FS.q);
  const todos = (S.stock || []).filter(s => s.b === FS.b);
  $('#st_marca').innerHTML = marcaBodega(FS.b);
  const l = todos.filter(s => (!q || norm(s.n + ' ' + s.c).includes(q)) && (!FS.cat || s.cat === FS.cat) && (!FS.est || (FS.est === 'Alertas (todas)' ? !['OK', 'Agotado'].includes(s.estado) : s.estado === FS.est)));
  $('#st_kpi').innerHTML = `<div class="kpis"><div class="kpi"><small>Valor en bodega</small><b>${peso(todos.reduce((a, s) => a + s.valor, 0))}</b></div><div class="kpi"><small>Bajo mínimo / sin stock</small><b style="color:var(--a)">${todos.filter(s => s.estado === 'Bajo mínimo' || s.estado === 'Sin stock').length}</b></div><div class="kpi"><small>Vencidos / por vencer</small><b style="color:var(--r)">${todos.filter(s => s.estado === 'Vencido' || s.estado === 'Vence pronto').length}</b></div></div>`;
  $('#st_lista').innerHTML = l.length ? l.map(s => `<div class="it" onclick="detalleStock('${s.c}')"><div class="c"><b>${h(s.n)}</b><small>${h(s.c)} · ${h(s.cat)}${s.venc ? ' · vence ' + fFecha(s.venc) + (s.qv && s.qv !== s.stock ? ' (' + n0(s.qv) + ')' : '') : ''}</small><br><span class="badge ${EST[s.estado]}">${h(s.estado)}</span></div><div class="num"><b>${n0(s.stock)}</b> ${h(s.u)}<br><small class="muted">mín. ${n0(s.min)}</small></div></div>`).join('') : '<p class="muted">No hay productos con ese filtro.</p>';
}
function detalleStock(c) {
  const s = stockDe(FS.b, c); if (!s) return;
  modal(`<h3>${h(s.n)}</h3><p class="muted">${h(s.c)} · ${h(s.cat)} · ${h(s.alm)}</p>
  <table class="tabla"><tr><td>Stock</td><td class="num"><b>${n0(s.stock)} ${h(s.u)}</b></td></tr><tr><td>Mínimo</td><td class="num">${n0(s.min)}</td></tr><tr><td>Estado</td><td class="num"><span class="badge ${EST[s.estado]}">${h(s.estado)}</span></td></tr>
  <tr><td>Próximo vencimiento</td><td class="num">${s.venc ? fFecha(s.venc) + ' (' + n0(s.qv) + ' ' + h(s.u) + ')' : '—'}</td></tr><tr><td>Valor</td><td class="num">${peso(s.valor)}</td></tr>
  ${(() => { const p = (S.productos || []).find(x => x.c === s.c); const pv = p && p.prov && (S.proveedores || []).find(x => x.nombre === p.prov); return p && p.prov ? `<tr><td>Proveedor</td><td class="num">${h(p.prov)}${pv && pv.pedido ? '<br><small class="muted">pedir: ' + h(pv.pedido) + '</small>' : ''}</td></tr>` : ''; })()}
  <tr><td>Última entrada</td><td class="num">${fFecha(s.ultE) || '—'}</td></tr><tr><td>Última salida</td><td class="num">${fFecha(s.ultS) || '—'}</td></tr></table>
  <div class="row" style="margin-top:14px">${esAdmin() ? `<button class="btn gris" onclick="cerrarModal();ir(movimientosVista,'${s.c}')">Movimientos</button>` : ''}<button class="btn" onclick="cerrarModal()">Cerrar</button></div>`);
}

/* ═════════════════════ Inventario físico ═════════════════════ */
function inventario() {
  const b = bodegaActual();
  pantalla('Inventario físico', `
  <div class="aviso v">Cuenta lo que hay realmente y escribe la cantidad. Deja en blanco lo que no contaste. El sistema registra la diferencia como ajuste. Úsalo también para cargar el <b>stock inicial</b> la primera vez.</div>
  <div class="card"><b>¿Tienen el stock en un Excel?</b><p class="muted" style="font-size:13px;margin:4px 0 8px">Columnas <b>Producto</b> y <b>Cantidad</b> (o Stock). Opcionales: Código, Unidad, Categoría, Vencimiento, Costo. También sirve un Excel de entradas y salidas: calcula el saldo.</p><div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn sec" onclick="planillaConteo()">📄 Descargar planilla para contar</button><button class="btn sec" onclick="stockExcel()">📥 Cargar stock desde Excel</button></div></div>
  <div class="filtros">${bodegaSel('inv_b', b)}${selectHTML('inv_cat', S.categorias, '', 'Todas las categorías')}</div>
  <div class="card lista" id="inv_l"></div>`, { barra: `<button class="btn" onclick="guardarInventario()">Guardar conteo</button>` });

    const bb = $('#inv_b').value, cat = $('#inv_cat').value; ls.set('bodega', bb);
    const lista = (S.productos || []).filter(p => !cat || p.cat === cat).map(p => ({ p, s: stockDe(bb, p.c) })).filter(x => x.s || !x.p.b || x.p.b === bb);
    $('#inv_l').innerHTML = lista.map(({ p, s }) => `<div class="it"><div class="c"><b>${h(p.n)}</b><small>${h(p.c)} · sistema: ${n0(s ? s.stock : 0)} ${h(p.u)}</small></div><input style="max-width:110px" type="number" inputmode="decimal" step="any" data-inv="${p.c}" placeholder="${h(p.u)}"></div>`).join('');
  };
  $('#inv_b').onchange = pintar; $('#inv_cat').onchange = pintar; pintar();
}
async function guardarInventario() {
  const items = $$('[data-inv]').filter(i => i.value !== '').map(i => ({ c: i.dataset.inv, conteo: Number(i.value) }));
  if (!items.length) return toast('No escribiste ningún conteo');
  if (!confirm('¿Guardar el conteo de ' + items.length + ' productos? Las diferencias quedan registradas como ajuste.')) return;
  try { const r = await api('ajuste', { bodega: $('#inv_b').value, items }); S.stock = r.stock; ls.set('sesion', S); toast(`✅ ${r.ajustes} diferencias ajustadas (${peso(r.valor)})`, 4500); pila.pop(); ir(stockVista, false); }
  catch (e) { toast(e.message); }
}

function productosVista() {
  pantalla('Productos', `<div class="filtros"><input id="pv_q" placeholder="🔎 Buscar producto">${selectHTML('pv_cat', S.categorias, '', 'Todas')}</div><div class="card lista" id="pv_l"></div>`, { barra: `<button class="btn" onclick="nuevoProducto(()=>productosVista())">+ Nuevo producto</button>` });
  const pintar = () => { const q = norm($('#pv_q').value), cat = $('#pv_cat').value; $('#pv_l').innerHTML = (S.productos || []).filter(p => (!q || norm(p.n + p.c).includes(q)) && (!cat || p.cat === cat)).map(p => `<div class="it" onclick="nuevoProducto(()=>productosVista(),(S.productos||[]).find(x=>x.c==='${p.c}'))"><div class="c"><b>${h(p.n)}</b><small>${h(p.c)} · ${h(p.cat)} · ${h(p.alm)}${p.prov ? ' · 🚚 ' + h(p.prov) : ''}</small></div><div class="num">${h(p.u)}<br><small class="muted">mín. ${n0(p.min)}</small></div></div>`).join('') || '<p class="muted">Sin productos.</p>'; };
  $('#pv_q').oninput = pintar; $('#pv_cat').onchange = pintar; pintar();
}

/* ═════════════════════ Lo que me toca llenar ═════════════════════ */
function pendientesHTML() {
  const p = S.pendientes || []; if (!p.length) return '';
  const meta = p.reduce((a, x) => a + x.meta, 0), hechos = p.reduce((a, x) => a + x.hechos, 0), pct = Math.round(hechos / (meta || 1) * 100);
  return `<h2>Lo que te toca llenar</h2><div class="card tareas"><div style="display:flex;justify-content:space-between;align-items:center"><b>${pct === 100 ? '✅ ¡Todo al día!' : `Llevas ${hechos} de ${meta}`}</b><small class="muted">${pct}%</small></div><div class="prog"><i style="width:${pct}%"></i></div>

/* ═════════════════════ Minutas (menú de hoy) ═════════════════════ */
function lunesDe(iso) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; }

  if ((m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0');
  if ((m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/))) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
  const d = new Date(t); if (t && !isNaN(d)) return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  return def;

/* ═════════════════════ Lector de Excel (xlsx/xlsm/csv) en el navegador ═════════════════════ */
async function leerExcel(file) {

  if (buf[0] !== 0x50 || buf[1] !== 0x4b) {

    return { Hoja1: txt.split(/\r?\n/).filter(l => l.trim()).map(l => l.split(sep).map(x => x.replace(/^"|"$/g, '').trim())) };
  }
  const dv = new DataView(buf.buffer); let e = buf.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('El archivo no es un Excel válido');
  const n = dv.getUint16(e + 10, true); let off = dv.getUint32(e + 16, true); const F = {};
  for (let i = 0; i < n; i++) {
    const nl = dv.getUint16(off + 28, true), el = dv.getUint16(off + 30, true), cl = dv.getUint16(off + 32, true);
    F[new TextDecoder().decode(buf.subarray(off + 46, off + 46 + nl))] = { met: dv.getUint16(off + 10, true), csz: dv.getUint32(off + 20, true), lho: dv.getUint32(off + 42, true) };
    off += 46 + nl + el + cl;
  }
  const leer = async nombre => {
    const f = F[nombre]; if (!f) return null;
    const ini = f.lho + 30 + dv.getUint16(f.lho + 26, true) + dv.getUint16(f.lho + 28, true), data = buf.subarray(ini, ini + f.csz);
    if (f.met === 0) return new TextDecoder().decode(data);
    return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  };
  const X = s => new DOMParser().parseFromString(s, 'application/xml');
  const ss = await leer('xl/sharedStrings.xml');
  const strs = ss ? [...X(ss).getElementsByTagName('si')].map(si => [...si.getElementsByTagName('t')].map(t => t.textContent).join('')) : [];
  const wb = X(await leer('xl/workbook.xml')), rels = X(await leer('xl/_rels/workbook.xml.rels') || '<r/>'), rmap = {};
  [...rels.getElementsByTagName('Relationship')].forEach(r => rmap[r.getAttribute('Id')] = r.getAttribute('Target'));
  const out = {};
  for (const sh of [...wb.getElementsByTagName('sheet')]) {
    const rid = sh.getAttribute('r:id') || [...sh.attributes].find(a => /id$/i.test(a.name) && a.name !== 'sheetId')?.value;
    let t = rmap[rid] || ''; t = t.startsWith('/') ? t.slice(1) : 'xl/' + t.replace(/^\.\//, '');
    const xs = await leer(t); if (!xs) continue;
    const filas = [];
    [...X(xs).getElementsByTagName('row')].forEach(r => {
      const fila = [];
      [...r.getElementsByTagName('c')].forEach(c => {
        const col = c.getAttribute('r').replace(/\d+/g, '').split('').reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0) - 1;
        const tp = c.getAttribute('t'), v = c.getElementsByTagName('v')[0]; let val = v ? v.textContent : '';
        if (tp === 's') val = strs[Number(val)] || ''; else if (tp === 'inlineStr') val = [...c.getElementsByTagName('t')].map(x => x.textContent).join('');
        else if (tp !== 'str' && val !== '' && !isNaN(val)) val = Number(val);
        fila[col] = val;
      });
      filas[Number(r.getAttribute('r')) - 1] = [...fila].map(x => x === undefined ? '' : x);
    });
    out[sh.getAttribute('name')] = [...filas].map(f => f || []);
  }

}

function abParseFactores(hojas, C) {
  const nombres = Object.keys(hojas).sort((a, b) => (/FACTOR|PROGRAM/i.test(b) ? 1 : 0) - (/FACTOR|PROGRAM/i.test(a) ? 1 : 0));
  for (const nom of nombres) {
    const H = hojas[nom];
    for (let i = 0; i < Math.min(H.length, 25); i++) {
      const enc = (H[i] || []).map(x => norm(x));
      const iDia = enc.findIndex(c => c === 'DIA' || c.startsWith('DIA ')); if (iDia < 0) continue;
      const iSem = enc.findIndex(c => c.startsWith('SEMANA')), iSv = enc.findIndex(c => c === 'SERVICIO' || c === 'TIEMPO');
      const svCol = C.servs.map(sv => [sv, enc.findIndex(c => c === norm(sv) || c.startsWith(norm(sv) + ' '))]).filter(x => x[1] >= 0);
      const dCol = C.D.map(d => { const k = norm(cortoDest(d)).split(' ').filter(w => w.length > 3).pop() || norm(cortoDest(d)); return [d, enc.findIndex((c, j) => j !== iDia && c.includes(k))]; }).filter(x => x[1] >= 0);
      const out = []; let semAct = AB.sem || 1;
      for (let j = i + 1; j < H.length; j++) {
        const r = H[j] || []; if (iSem >= 0 && r[iSem] !== '' && r[iSem] != null) { const m = String(r[iSem]).match(/\d+/); if (m) semAct = Number(m[0]); }
        const d = DIA_N(r[iDia]); if (!d || !(semAct >= 1 && semAct <= 4)) continue;
        if (iSv >= 0 && dCol.length) {
          const sv = C.servs.find(x => norm(x) === norm(r[iSv])) || C.servs.find(x => norm(r[iSv]).startsWith(norm(x)));
          if (sv) dCol.forEach(([dest, k]) => out.push({ s: semAct, d, sv, dest, n: Math.max(0, Math.round(Number(r[k]) || 0)) }));
        } else if (svCol.length) {
          const dest = AB.dest || (C.D.length === 1 ? C.D[0] : '');
          if (!dest) throw new Error('Este Excel trae una sola columna por servicio: elige primero el internado (pestaña de arriba) al que corresponde');
          svCol.forEach(([sv, k]) => out.push({ s: semAct, d, sv, dest, n: Math.max(0, Math.round(Number(r[k]) || 0)) }));
        }
      }

    }
  }

}

async function paeExcel(mes) {
  try {
    const [datos, plan] = await Promise.all([api('paeDatos', { mes }, { txt: 'Preparando planilla…' }), fetch('plantilla_pae_canela.xlsx').then(r => { if (!r.ok) throw new Error('No encontré la plantilla PAE (plantilla_pae_canela.xlsx en GitHub)'); return r.arrayBuffer(); })]);
    const Z = await zipAbrir(new Uint8Array(plan)), dec = new TextDecoder(), enc = new TextEncoder();
    const wb = dec.decode(Z.f['xl/workbook.xml']), rels = dec.decode(Z.f['xl/_rels/workbook.xml.rels']);
    const [y, m] = mes.split('-').map(Number), MES = MESES_ES[m - 1], ult = new Date(y, m, 0).getDate();
    const hojas = [...wb.matchAll(/<sheet [^>]*?name="([^"]+)"[^>]*?r:id="([^"]+)"/g)].map(x => ({ nom: x[1], rid: x[2] }));
    let usadas = 0;
    datos.forEach(e => {
      const hj = hojas.find(x => norm(x.nom) === norm(e.hoja)) || hojas.find(x => norm(e.nombre).includes(norm(x.nom))); if (!hj) return;
      const tgt = (rels.match(new RegExp(`Id="${hj.rid}"[^>]*?Target="([^"]+)"`)) || rels.match(new RegExp(`Target="([^"]+)"[^>]*?Id="${hj.rid}"`)) || [])[1]; if (!tgt) return;
      const ruta = tgt.startsWith('/') ? tgt.slice(1) : 'xl/' + tgt.replace(/^\.\//, ''); let x = dec.decode(Z.f[ruta]);
      // La plantilla trae 30 días (filas 15 a 44) y el total en la 45: si el mes tiene 31, se agrega una fila igual y el total baja
      const filaTot = ult === 31 ? 46 : 45;
      if (ult === 31 && !/<c r="A46"/.test(x)) { const f44 = xmlFila(x, 44), f45 = xmlFila(x, 45); x = x.replace(f45, xmlMoverFila(f44, 44, 45) + xmlMoverFila(f45, 45, 46)).replace(/(<dimension ref="[A-Z]+\d+:[A-Z]+)45"/, '$146"'); }
      x = xmlCelda(x, 'G7', MES); x = xmlCelda(x, 'I7', y); x = xmlCelda(x, 'I9', e.programados);
      for (let d = 1; d <= 31; d++) {
        const r = 14 + d; if (r >= filaTot) break; const v = e.dias[d];
        if (d > ult) { ['A', 'B', 'C', 'D', 'E', 'F'].forEach(c => { x = xmlCelda(x, c + r, ''); }); continue; }

      }
      ['B', 'C', 'D', 'E'].forEach((c, i) => { x = xmlCelda(x, c + filaTot, e.total[i]); }); x = xmlCelda(x, 'F' + filaTot, e.total.reduce((a, b) => a + b, 0));

    const blob = zipCrear(Z.orden, Z.f), a = document.createElement('a'), nombre = `PAE_Canela_${MES}_${y}.xlsx`;
    a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    $('#pae_res').innerHTML = `<div class="aviso v" style="margin-top:10px">📥 Se descargó <b>${nombre}</b> con el mismo formato de la planilla original.<br>${datos.map(x => `<b>${h(x.nombre)}</b>: ${n0(x.total.reduce((a, b) => a + b, 0))} raciones en ${x.programados} días`).join('<br>')}</div>`;
    window._paeBlob = blob;
  } catch (e) { toast(e.message, 6000); }
}

/* ═════════════════════ Proveedores ═════════════════════ */
const DIAS = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
function diasDe(txt) {
  const t = norm(txt).toLowerCase(), out = new Set();
  const re = /(lunes|martes|miercoles|jueves|viernes|sabado|domingo)(\s+a\s+(lunes|martes|miercoles|jueves|viernes|sabado|domingo))?/g; let m;
  while ((m = re.exec(t))) { if (m[3]) { let i = DIAS.indexOf(m[1]); const f = DIAS.indexOf(m[3]); for (let k = 0; k < 7; k++) { out.add(DIAS[i]); if (i === f) break; i = (i + 1) % 7; } } else out.add(m[1]); }
  return out;
}
function pedirHoy() { const hoy = DIAS[new Date().getDay()]; return (S.proveedores || []).filter(p => diasDe(p.pedido).has(hoy)).map(p => p.nombre); }
function contactosHTML(c) {
  return String(c || '').split(';').map(x => x.trim()).filter(Boolean).map(x => {
    const i = x.lastIndexOf(':'); const nom = i > 0 ? x.slice(0, i).trim() : ''; const tel = (i > 0 ? x.slice(i + 1) : x).trim(); const dig = tel.replace(/\D/g, '');
    const cel = /^569\d{8}$/.test(dig) ? dig : /^9\d{8}$/.test(dig) ? '56' + dig : '';
    return `<div class="row" style="align-items:center;margin-top:6px"><div><b style="font-size:14px">${h(nom || 'Teléfono')}</b><br><small class="muted">${h(tel)}</small></div>
      <a class="btn chico sec" style="flex:0 0 auto" href="tel:${h(tel.replace(/[^\d+]/g, ''))}">📞</a>${cel ? `<a class="btn chico" style="flex:0 0 auto" target="_blank" href="https://wa.me/${cel}">WhatsApp</a>` : ''}</div>`;
  }).join('');
}
function sugerido(prov) {
  const b = S.config.bodegas[0];
  return (S.productos || []).filter(p => p.prov === prov).map(p => {
    const s = stockDe(b, p.c), st = s ? s.stock : 0;
    let sug = p.min > 0 && st < p.min * 1.5 ? p.min * 2 - st : 0;
    sug = p.u === 'kg' || p.u === 'L' ? Math.ceil(sug * 2) / 2 : Math.ceil(sug);
    return { p, st, sug: Math.max(0, sug) };
  }).sort((a, b) => b.sug - a.sug || a.p.n.localeCompare(b.p.n));
}
let PEDS = [];
async function pedidoVista(prov, pre) {
  const pv = (S.proveedores || []).find(x => x.nombre === prov) || { nombre: prov };
  const l = sugerido(prov);
  if (pre) { l.forEach(x => { if (!(x.p.c in pre)) x.sug = 0; }); Object.keys(pre).forEach(c => { const x = l.find(y => y.p.c === c); if (x) x.sug = pre[c]; else { const p = (S.productos || []).find(y => y.c === c); if (p) { const st = (S.stock || []).filter(z => z.c === c).reduce((a, z) => a + Number(z.stock || 0), 0); l.unshift({ p, st, sug: pre[c] }); } } }); l.sort((a, b) => (b.sug > 0) - (a.sug > 0)); }
  pantalla('Pedido a ' + prov, `<div class="card"><b>${h(prov)}</b><br><small class="muted">Pedido: ${h(pv.pedido || '—')} · Llega: ${h(pv.llegada || '—')}</small>
    <p class="muted" style="font-size:13px;margin:8px 0 0">${pre ? 'Cantidades calculadas desde la minuta y las raciones de la semana' + (margenCompra() ? ' (+' + margenCompra() + ' % extra)' : '') + ', descontando el stock.' : 'Sugerido = lo que falta para llegar al doble del mínimo.'} Ajusta las cantidades antes de enviar.</p></div>
    <div class="card"><table class="tabla vt" id="pd_t"><tr><th>Producto</th><th class="num">Hay</th><th class="centro">Pedir</th></tr>
    ${l.map(x => `<tr data-c="${x.p.c}"><td><b>${h(x.p.n)}</b><br><small class="muted">mín. ${n0(x.p.min)} ${h(x.p.u)}</small></td><td class="num" style="color:${x.p.min && x.st < x.p.min ? 'var(--r)' : ''}">${n0(x.st)}</td><td class="centro"><input class="pd_q" type="number" inputmode="decimal" step="any" value="${x.sug || ''}" placeholder="${h(x.p.u)}"></td></tr>`).join('')}</table>
    <div class="row" style="margin-top:10px"><input id="pd_otro" list="dl-prod" placeholder="+ Otro producto"><button class="btn sec chico" style="flex:0 0 auto" onclick="otroPedido()">Agregar</button></div></div>
    <div class="card"><label class="l" style="margin-top:0">Nota para el proveedor <small>(opcional)</small></label><input id="pd_nota" placeholder="Ej: entregar antes de las 11"></div>
    <h2>Pedidos anteriores</h2><div id="pd_hist" class="card"><p class="muted">Cargando…</p></div>`,
    { barra: `<button class="btn gris" onclick="enviarPedido('${h(prov)}',false)">Copiar</button><button class="btn" onclick="enviarPedido('${h(prov)}',true)">Enviar por WhatsApp</button>` });
  try { PEDS = await api('pedidos', { proveedor: prov }, { mudo: true }); } catch (e) { PEDS = []; }
  $('#pd_hist').innerHTML = PEDS.length ? PEDS.slice(0, 5).map(p => `<div style="padding:8px 0;border-bottom:1px solid #EEF2EF"><b>${fFecha(p.fecha)}</b> <small class="muted">· ${h(p.quien)}</small><br><small style="white-space:pre-line">${h(p.detalle)}</small></div>`).join('') : '<p class="muted">Aún no hay pedidos registrados.</p>';
}
function otroPedido() {

  $('#pd_t').insertAdjacentHTML('beforeend', `<tr data-c="${p.c}"><td><b>${h(p.n)}</b></td><td class="num">${n0(s ? s.stock : 0)}</td><td class="centro"><input class="pd_q" type="number" inputmode="decimal" step="any" placeholder="${h(p.u)}"></td></tr>`);

async function enviarPedido(prov, wa) {
  const lineas = $$('#pd_t tr[data-c]').map(tr => { const p = (S.productos || []).find(x => x.c === tr.dataset.c); return { c: p.c, n: p.n, u: p.u, cant: Number($('.pd_q', tr).value) || 0 }; }).filter(l => l.cant > 0);
  if (!lineas.length) return toast('Pon la cantidad de al menos un producto');
  const pv = (S.proveedores || []).find(x => x.nombre === prov) || {};
  const contacto = String(pv.contacto || '').split(';').map(x => x.trim()).find(x => /\+?56\s*9|\b9\s?\d{4}/.test(x)) || '';
  const nombre = contacto.includes(':') ? contacto.split(':')[0].trim() : '';
  const cel = (contacto.split(':').pop() || '').replace(/\D/g, '');
  const nota = $('#pd_nota').value.trim();
  const txt = `Hola${nombre && !/callcenter|vendedor/i.test(nombre) ? ' ' + nombre.split(' ')[0] : ''}, le escribo de Clean Food (Illapel). Quisiera hacer el siguiente pedido:\n\n${lineas.map(l => `• ${l.n.charAt(0) + l.n.slice(1).toLowerCase()}: ${n0(l.cant)} ${l.u}`).join('\n')}${nota ? '\n\n' + nota : ''}\n\n¿Me confirma por favor la fecha de entrega? Gracias.`;
  try { await api('pedido', { proveedor: prov, lineas, llega: pv.llegada || '' }, { txt: 'Registrando pedido…' }); } catch (e) { if (!e.red) return toast(e.message); }
  if (wa && cel) window.open('https://wa.me/' + (cel.length === 9 ? '56' + cel : cel) + '?text=' + encodeURIComponent(txt), '_blank');
  else { try { await navigator.clipboard.writeText(txt); toast('📋 Pedido copiado. Pégalo en WhatsApp o correo.'); } catch (e) { modal(`<h3>Pedido</h3><textarea style="min-height:220px">${h(txt)}</textarea><button class="btn full" style="margin-top:10px" onclick="cerrarModal()">Listo</button>`); } }
  if (wa && !cel) toast('Este proveedor no tiene celular registrado: el pedido quedó copiado.');
  pedidoVista(prov);
}

let MOVS = [];
async function cargarMovs() { try { MOVS = await api('movimientos', { desde: $('#mv_d').value, hasta: $('#mv_h').value }); pintarMovs(); } catch (e) { toast(e.message); } }
function pintarMovs() {

function editarMov(id) {
  const m = MOVS.find(x => String(x['ID']) === String(id)); if (!m) return;
  const tipo = m['Tipo'], u = m['Unidad'], ent = tipo === 'ENTRADA', sal = tipo === 'SALIDA';

    <label class="l">Cantidad (${h(u)})${tipo === 'AJUSTE' ? ' <small>(negativo = faltaba)</small>' : ''}</label><input id="em_q" type="number" inputmode="decimal" step="any" value="${h(m['Cantidad'])}">

      <label class="l">Proveedor</label><input id="em_d" list="dl-prov" value="${h(m['Proveedor / Destino'] || '')}">`
    : sal ? `<label class="l">Destino / servicio</label>${selectHTML('em_d', dest, m['Proveedor / Destino'])}<label class="l">Motivo</label>${selectHTML('em_m', mot, motivo0)}` : ''}
    <div class="row" style="margin-top:14px">${esAdmin() ? `<button class="btn rojo" id="em_del">Anular</button>` : ''}<button class="btn gris" onclick="cerrarModal()">Cancelar</button><button class="btn" id="em_ok">Guardar</button></div>`);
  const tot = () => { if (!$('#em_t')) return; const q = Number($('#em_q').value) || 0, c = Number($('#em_c').value) || 0; $('#em_t').innerHTML = q && c ? `${n0(q)} ${h(u)} × ${peso(c)} = <b>${peso(Math.round(q * c))}</b> neto<br><small class="muted">Con IVA: ${peso(Math.round(q * c * 1.19))}</small>` : '<small class="muted">Escribe cantidad y costo para ver el total</small>'; };
  $('#em_q').oninput = tot; if ($('#em_c')) $('#em_c').oninput = tot; tot();
  const enviar = async d => {
    try { const r = await api('editarMovimiento', { id, ...d }, { txt: 'Guardando…' }); S.stock = r.stock; if (r.productos) S.productos = r.productos; ls.set('sesion', S); cerrarModal(); toast(d.borrar ? '🗑️ Movimiento anulado y stock recalculado' : '✅ Movimiento corregido y stock recalculado'); cargarMovs(); }

  if ($('#em_del')) $('#em_del').onclick = () => confirm('¿Anular este movimiento? La cantidad queda en 0 y el stock se recalcula.') && enviar({ borrar: true });

    const pp = $$('[data-pp]'), pf = $$('[data-pf]'), selP = pp.filter(c => c.checked).map(c => c.dataset.pp), selF = pf.filter(c => c.checked).map(c => c.dataset.pf);
    if (!selP.length && !selF.length) return toast('Marca al menos una pantalla o formulario');
    const d = { nombre: $('#pe_n').value.trim(), rol: $('#pe_r').value, desc: $('#pe_d').value.trim(), pantallas: selP.length === pp.length ? [] : selP, forms: selF.length === pf.length ? [] : selF };
    if (!d.nombre) return toast('Escribe el nombre del perfil');
    try { const r = await api('perfil', { original: p.nombre, perfil: d }, { txt: 'Guardando…' }); PERFS = r.perfiles; TRABS = r.trabajadores; cerrarModal(); toast('✅ Perfil guardado. Los trabajadores lo verán al volver a entrar.'); pintarPerfiles(); } catch (e) { toast(e.message, 5000); }
  };
  if ($('#pe_del')) $('#pe_del').onclick = async () => { if (!confirm('¿Borrar el perfil ' + p.nombre + '?')) return; try { const r = await api('perfil', { original: p.nombre, borrar: true }); PERFS = r.perfiles; TRABS = r.trabajadores; cerrarModal(); toast('🗑️ Perfil borrado'); pintarPerfiles(); } catch (e) { toast(e.message, 5000); } };
}
async function trabajadoresVista() {
  pantalla('Usuarios', `<div class="filtros"><input id="us_q" placeholder="🔎 Buscar nombre o RUT" value="${h(FU.q)}">${selectHTML('us_rol', Object.keys(ROLES), FU.rol, 'Todos los cargos')}</div>
    <div id="us_kpi"></div><div class="card lista" id="tr_l"><p class="muted">Cargando…</p></div>`, { barra: `<button class="btn" onclick="editarTrab()">+ Agregar usuario</button>` });
  $('#us_rol').innerHTML = '<option value="">Todos los cargos</option>' + Object.keys(ROLES).map(r => `<option value="${r}" ${r === FU.rol ? 'selected' : ''}>${ROLES[r]}</option>`).join('');
  $('#us_q').oninput = $('#us_rol').onchange = () => { FU = { q: $('#us_q').value, rol: $('#us_rol').value }; pintarTrabs(); };
  try { const [t, pf] = await Promise.all([api('trabajadores', {}, { mudo: true }), api('perfiles', {}, { mudo: true }).catch(() => ({ perfiles: [] }))]); TRABS = t; PERFS = pf.perfiles || []; pintarTrabs(); } catch (e) { toast(e.message); }
}
function pintarTrabs() {
  const q = norm(FU.q), l = TRABS.map((t, i) => ({ ...t, i })).filter(t => (!q || norm(t.nombre + ' ' + t.rut + ' ' + t.cargo).includes(q)) && (!FU.rol || t.rol === FU.rol))
    .sort((a, b) => (b.activo - a.activo) || (a.rol === 'admin' ? -1 : 0) - (b.rol === 'admin' ? -1 : 0) || a.nombre.localeCompare(b.nombre));
  const cuenta = r => TRABS.filter(t => t.activo && t.rol === r).length;
  $('#us_kpi').innerHTML = `<div class="kpis">${Object.keys(ROLES).filter(cuenta).map(r => `<div class="kpi"><small>${h(ROLES[r])}</small><b>${cuenta(r)}</b></div>`).join('')}</div>`;
  $('#tr_l').innerHTML = l.length ? l.map(t => `<div class="it" onclick="editarTrab(${t.i})" style="${t.activo ? '' : 'opacity:.5'}">
    <div style="width:40px;height:40px;border-radius:50%;background:${t.rol === 'admin' ? 'var(--v)' : 'var(--v2)'};color:${t.rol === 'admin' ? '#fff' : 'var(--v)'};display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto">${h(t.nombre.split(' ').map(x => x[0]).slice(0, 2).join(''))}</div>
    <div class="c"><b>${h(t.nombre)}</b><small>${h(t.rut)}${t.cargo ? ' · ' + h(t.cargo) : ''}${t.servicio ? ' · ' + h(t.servicio) : ''}</small>
    <small style="display:block">${t.ultimo ? 'Último ingreso ' + fFecha(t.ultimo) : 'Nunca ha entrado'}${t.pinSinCambiar ? ' · <span style="color:var(--a)">PIN inicial</span>' : ''}${!t.activo ? ' · desactivado' : ''}${!/^\d/.test(t.rut) ? ' · <span style="color:var(--a)">falta RUT</span>' : ''}</small></div>
    <span class="badge ${t.rol === 'admin' ? 'b-ok' : 'b-g'}">${h(t.perfil || ROLES[t.rol] || t.rol)}</span></div>`).join('') : '<p class="muted">Sin usuarios con ese filtro.</p>';
}
function editarTrab(i) {
  const nuevo = i == null, t = nuevo ? { rut: '', nombre: '', cargo: '', rol: 'cocina', servicio: '', tel: '', activo: true } : TRABS[i];
  const yo = !nuevo && normRut(t.rut) === normRut(S.usuario.rut);
  modal(`<h3>${nuevo ? 'Nuevo usuario' : 'Editar usuario'}</h3>
    <label class="l">RUT <small>(o usuario temporal, ej: PATRICIO)</small></label><input id="tr_rut" value="${h(t.rut)}" placeholder="12.345.678-9">
    <label class="l">Nombre completo</label><input id="tr_nom" value="${h(t.nombre)}">
    <div class="row"><div><label class="l">Cargo</label><input id="tr_cargo" value="${h(t.cargo)}" placeholder="Cocinera, chofer…"></div><div><label class="l">Teléfono</label><input id="tr_tel" value="${h(t.tel)}" inputmode="tel"></div></div>
    ${PERFS.length ? `<label class="l">Perfil <small>(define qué ve en la app)</small></label><select id="tr_perf" onchange="const p=PERFS.find(x=>x.nombre===this.value);$('#tr_rol').disabled=!!p;if(p)$('#tr_rol').value=p.rol"><option value="">Sin perfil (según el rol)</option>${PERFS.map(p => `<option ${p.nombre === t.perfil ? 'selected' : ''}>${h(p.nombre)}</option>`).join('')}</select>` : ''}
    <label class="l">Rol ${PERFS.length ? '<small>(lo pone el perfil)</small>' : ''}</label><select id="tr_rol" ${t.perfil && PERFS.some(p => p.nombre === t.perfil) ? 'disabled' : ''}>${Object.keys(ROLES).map(r => `<option value="${r}" ${r === t.rol ? 'selected' : ''}>${ROLES[r]}</option>`).join('')}</select>
    <p class="muted" style="font-size:13px;margin:6px 0 0">Cocina y Atención: menú, inocuidad, raciones, ventas y encargos. Chofer: vehículo, rutina y prevención. Bodega: recepción, salidas, stock y pedidos. Administración: todo, incluidos los usuarios.</p>
    <label class="l">Servicio habitual</label>${selectHTML('tr_serv', S.config.servicios, t.servicio, '—')}
    <label class="l">${nuevo ? 'PIN' : 'PIN nuevo'} <small>(${nuevo ? 'vacío = 4 primeros números del RUT, o 1234 si es usuario' : 'déjalo vacío para no cambiarlo'})</small></label><input id="tr_pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••">
    ${!nuevo ? `<label style="display:flex;gap:8px;margin-top:12px"><input type="checkbox" id="tr_act" style="width:auto" ${t.activo ? 'checked' : ''} ${yo ? 'disabled' : ''}> Activo (puede entrar)</label>
    <label style="display:flex;gap:8px;margin-top:8px"><input type="checkbox" id="tr_reset" style="width:auto"> Volver al PIN inicial</label>` : ''}
    <div class="row" style="margin-top:16px">${!nuevo && !yo ? '<button class="btn rojo" id="tr_del">Eliminar</button>' : '<button class="btn gris" onclick="cerrarModal()">Cancelar</button>'}<button class="btn" id="tr_ok">Guardar</button></div>`);
  const enviar = async borrar => {
    const d = { nuevo, original: nuevo ? '' : t.rut, rut: $('#tr_rut').value.trim(), nombre: $('#tr_nom').value.trim(), cargo: $('#tr_cargo').value.trim(), rol: $('#tr_rol').value, perfil: $('#tr_perf') ? $('#tr_perf').value : (t.perfil || ''), servicio: $('#tr_serv').value, tel: $('#tr_tel').value.trim(),
      pin: $('#tr_pin').value.trim(), activo: nuevo || yo || $('#tr_act').checked, resetPin: !nuevo && $('#tr_reset').checked, borrar };
    if (!d.rut || !d.nombre) return toast('RUT (o usuario) y nombre son obligatorios');
    if (/^\d/.test(d.rut) && !rutValido(d.rut)) return toast('El RUT no es válido (revisa el dígito verificador)');
    if (d.pin && !/^\d{4,6}$/.test(d.pin)) return toast('El PIN debe tener 4 a 6 números');
    try { TRABS = await api('trabajador', { t: d }); S.trabajadores = TRABS.map(x => ({ rut: x.rut, nombre: x.nombre })); cerrarModal(); pintarTrabs(); toast(borrar ? 'Usuario eliminado' : '✅ Guardado'); } catch (e) { toast(e.message, 4500); }
  };
  $('#tr_ok').onclick = () => enviar(false);
  if ($('#tr_del')) $('#tr_del').onclick = () => confirm('¿Eliminar a ' + t.nombre + '? Si solo dejó de trabajar, mejor desactívalo para mantener su historial.') && enviar(true);
}
function rutValido(r) { const c = normRut(r); if (c.length < 2) return false; const cu = c.slice(0, -1), dv = c.slice(-1); let s = 0, m = 2; for (let i = cu.length - 1; i >= 0; i--) { s += Number(cu[i]) * m; m = m === 7 ? 2 : m + 1; } const e = 11 - s % 11; return dv === (e === 11 ? '0' : e === 10 ? 'K' : String(e)); }

function configVista() {
  const c = S.configCompleta || {};
  const campo = (k, lab, ayuda, area = true) => `<label class="l">${h(lab)}${ayuda ? ' <small>· ' + h(ayuda) + '</small>' : ''}</label>${area ? `<textarea data-cfg="${k}">${h(c[k] || '')}</textarea>` : `<input data-cfg="${k}" value="${h(c[k] || '')}">`}`;
  pantalla('Configuración', `<div class="card">
    ${campo('empresa', 'Nombre de la empresa', '', false)}
    ${campo('correo_alertas', 'Correo(s) que reciben las alertas', 'separados por coma', false)}
    ${campo('bodegas', 'Bodegas', 'separadas por coma; la primera es la central')}
    ${campo('servicios', 'Servicios, casinos y clientes', 'separados por coma')}
    ${campo('motivos_salida', 'Motivos de salida', 'separados por coma')}
    ${campo('equipos_frio', 'Equipos de frío', 'Nombre|mín|máx, separados por coma')}
    ${campo('vehiculos', 'Patentes de vehículos', 'separadas por coma', false)}
    ${campo('precios_raciones', 'Precio neto por ración', 'Cliente|precio, separados por coma')}
    <div class="row"><div>${campo('dias_aviso_venc', 'Avisar vencimiento de productos', 'días antes', false)}</div><div>${campo('dias_aviso_docs', 'Avisar vencimiento de documentos', 'días antes', false)}</div></div>
    ${campo('color', 'Color de la app', 'ej: #1F7A4D', false)}
    <div class="aviso" style="margin-top:14px">Si cambias el nombre de una bodega, el stock ya registrado queda con el nombre anterior. Mejor agrega bodegas nuevas al final.</div>
  </div>`, { barra: `<button class="btn" onclick="guardarConfig()">Guardar</button>` });
}
async function guardarConfig() {
  const cfg = {}; $$('[data-cfg]').forEach(el => cfg[el.dataset.cfg] = el.value.trim().replace(/\s*\n\s*/g, ', '));
  try { await api('config', { config: cfg }); await refrescar(); toast('✅ Configuración guardada'); pila = []; inicio(); } catch (e) { toast(e.message); }
}

/* ═════════════════════ Arranque ═════════════════════ */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
if (S && S.token) { pila = []; inicio(); vaciarCola(); } else login();
</script>
