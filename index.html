<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clean Food · Bodega y Prevención</title>
<meta name="theme-color" content="#008833">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>document.write('<script src="config.js?t=' + Date.now() + '"><\/script>');</script>
<style>
:root{--v:#008833;--v-osc:#006B28;--lima:#96BC11;--v2:#E9F5EC;--t:#14261A;--g:#5D6E63;--b:#E3EAE5;--f:#F4F7F2;--r:#C62828;--r2:#FDECEA;--a:#B26A00;--a2:#FFF4E0;--ok:#008833;--w:#fff;--rad:16px;--sh:0 1px 2px rgba(20,38,26,.05),0 4px 14px rgba(20,38,26,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--f);color:var(--t);font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:#fff;color:var(--t);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 0 var(--b),0 4px 14px rgba(20,38,26,.05)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:linear-gradient(90deg,var(--v),var(--lima))}
header .tit{flex:1;min-width:0}
header .tit b{display:block;font-size:17px;color:var(--v-osc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .tit small{color:var(--g);font-size:12.5px}
header button{background:var(--v2);border:0;color:var(--v);border-radius:12px;width:42px;height:42px;font-size:18px;cursor:pointer;flex:0 0 auto}
header .mz{height:40px;flex:0 0 auto}
header .lg{height:42px;flex:0 0 auto}
main{max-width:900px;margin:0 auto;padding:16px 14px 110px}
h2{font-size:13px;color:var(--v-osc);text-transform:uppercase;letter-spacing:.07em;margin:26px 2px 12px;display:flex;align-items:center;gap:8px;font-weight:700}
h2::before{content:"";width:4px;height:16px;border-radius:3px;background:var(--lima)}
h3{margin:0 0 8px;font-size:17px}
.hero{background:linear-gradient(135deg,var(--v) 0%,#0A9A43 60%,var(--lima) 140%);color:#fff;border-radius:20px;padding:18px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero::before{content:"";position:absolute;right:40px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(150,188,17,.25)}
.hero b{font-size:21px;display:block}
.hero small{opacity:.9;font-size:14px}
.hero .chips{margin-top:12px;position:relative;z-index:1}
.hero .hc{background:rgba(255,255,255,.18);border-radius:20px;padding:6px 12px;font-size:13.5px;font-weight:600;cursor:pointer;border:0;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.tile{background:var(--w);border:1px solid var(--b);border-radius:var(--rad);padding:14px 13px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:7px;min-height:104px;box-shadow:var(--sh);transition:transform .12s,box-shadow .12s,border-color .12s}
.tile:hover{transform:translateY(-2px);border-color:#C7E0CF;box-shadow:0 6px 20px rgba(0,136,51,.12)}
.tile:active{transform:scale(.98)}
.tile .i{font-size:23px;width:46px;height:46px;border-radius:14px;background:var(--v2);display:flex;align-items:center;justify-content:center}
.tile b{font-size:15px;line-height:1.25}
.tile small{color:var(--g);font-size:12.5px;line-height:1.3}
.tile.dest{background:linear-gradient(140deg,var(--v),#0A9A43);color:#fff;border-color:transparent}
.tile.dest .i{background:rgba(255,255,255,.2)}
.tile.dest small{color:#DDF2E3}
.card{background:var(--w);border:1px solid var(--b);border-radius:var(--rad);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
label.l{display:block;font-weight:600;font-size:14px;margin:13px 0 6px;color:#2A3B30}
label.l small{font-weight:400;color:var(--g)}
input,select,textarea{width:100%;border:1.5px solid #D5DED8;border-radius:12px;padding:11px 12px;background:#FCFDFC;font-size:16px;transition:border-color .12s,box-shadow .12s}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--v);box-shadow:0 0 0 3px rgba(0,136,51,.15);background:#fff}
.row{display:flex;gap:10px;align-items:flex-end}
.row>*{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:13px 16px;background:var(--v);color:#fff;font-weight:700;cursor:pointer;font-size:16px;box-shadow:0 2px 8px rgba(0,136,51,.25);transition:filter .12s,transform .1s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--v2);color:var(--v);box-shadow:none}
.btn.gris{background:#EEF2EF;color:var(--t);box-shadow:none}
.btn.rojo{background:var(--r2);color:var(--r);box-shadow:none}
.btn.chico{padding:8px 12px;font-size:14px;border-radius:11px}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.barra{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--b);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.barra .in{max-width:900px;margin:0 auto;display:flex;gap:10px}
.barra .btn{flex:1}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid #D5DED8;background:#fff;border-radius:11px;padding:8px 16px;min-width:58px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--v);border-color:var(--v);color:#fff}
.seg button.on.mal{background:var(--r);border-color:var(--r)}
.ck{padding:11px 0;border-bottom:1px solid #EEF2EF}
.ck:last-child{border-bottom:0}
.ck p{margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid #D5DED8;background:#fff;border-radius:20px;padding:8px 13px;font-size:14px;cursor:pointer;text-align:left}
.chip.on{background:var(--v2);border-color:var(--v);color:var(--v-osc);font-weight:700}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:#E2F3E7;color:var(--ok)}.b-r{background:var(--r2);color:var(--r)}.b-a{background:var(--a2);color:var(--a)}.b-g{background:#EEF2EF;color:var(--g)}
.aviso{background:var(--a2);border:1px solid #F3D19C;color:#6B4300;border-radius:14px;padding:12px 14px;margin:10px 0;font-size:14.5px}
.aviso.r{background:var(--r2);border-color:#F2B8B5;color:#7F1D1D}
.aviso.v{background:var(--v2);border-color:#BFDCC9;color:#174D33}
.lista .it{display:flex;gap:10px;align-items:center;padding:12px 2px;border-bottom:1px solid #EEF2EF;cursor:pointer}
.lista .it:last-child{border-bottom:0}
.lista .it .c{flex:1;min-width:0}
.lista .it .c b{display:block;font-size:15px}
.lista .it .c small{color:var(--g);font-size:13px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.num b{font-size:17px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--w);border:1px solid var(--b);border-radius:var(--rad);padding:13px 14px;box-shadow:var(--sh);border-top:3px solid var(--lima)}
.kpi small{color:var(--g);font-size:12.5px;display:block}
.kpi b{font-size:22px}
.item{border:1px solid var(--b);border-radius:14px;padding:12px;margin-bottom:10px;background:#FAFCFA}
.item.rech{background:var(--r2);border-color:#F2B8B5}
.item .fac{font-size:13px;color:var(--g);margin-bottom:8px;background:#EEF2EF;border-radius:9px;padding:7px 9px}
.item .sug{color:var(--a);font-size:12.5px;font-weight:600}
.x{flex:0 0 auto!important;background:none;border:0;font-size:20px;color:var(--g);cursor:pointer;padding:2px 6px}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.fotos img{width:78px;height:78px;object-fit:cover;border-radius:12px;border:1px solid var(--b)}
.firma{border:1.5px dashed #9FB0A6;border-radius:14px;background:#fff;width:100%;height:170px;touch-action:none;display:block}
.tabla{width:100%;border-collapse:collapse;font-size:14px}
.tabla th,.tabla td{padding:9px 6px;border-bottom:1px solid #EEF2EF;text-align:left;vertical-align:top}
.tabla th{font-size:12.5px;color:var(--g);font-weight:600}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#14261A;color:#fff;padding:12px 18px;border-radius:14px;z-index:50;max-width:90vw;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:sube .2s ease-out}
@keyframes sube{from{opacity:0;transform:translate(-50%,10px)}}
.modal{position:fixed;inset:0;background:rgba(20,38,26,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
@keyframes fd{from{opacity:0}}
.modal .box{background:#fff;width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:22px}}
.cargando{position:fixed;inset:0;background:rgba(244,247,242,.78);z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--g)}
.spin{width:44px;height:44px;border:4px solid var(--v2);border-top-color:var(--v);border-right-color:var(--lima);border-radius:50%;animation:g .9s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.fondo-login{min-height:100vh;background:radial-gradient(circle at 15% 10%,rgba(150,188,17,.18),transparent 40%),radial-gradient(circle at 90% 90%,rgba(0,136,51,.14),transparent 45%),var(--f);padding:1px 0 40px}
.login{max-width:400px;margin:7vh auto 0;padding:0 18px}
.login .marca{display:block;width:260px;max-width:80%;margin:0 auto 6px}
.login .sub{text-align:center;color:var(--g);margin:0 0 22px;font-size:14.5px;letter-spacing:.02em}
.login .card{padding:20px 18px;border-radius:22px;box-shadow:0 10px 30px rgba(20,38,26,.08)}
.centro{text-align:center}
.muted{color:var(--g);font-size:14px}
.cola{background:var(--a2);color:#6B4300;padding:9px 14px;font-size:14px;text-align:center;cursor:pointer;margin-top:3px}
.oculto{display:none!important}
details summary{cursor:pointer;font-weight:600;padding:4px 0;color:var(--v-osc)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filtros>*{flex:1;min-width:130px}
a{color:var(--v)}
.pie{text-align:center;margin-top:30px;color:var(--g);font-size:12px}
.pie img{height:28px;opacity:.75;display:block;margin:0 auto 6px}
</style>
</head>

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n0 = x => Number(x || 0).toLocaleString('es-CL', { maximumFractionDigits: 3 });
const peso = x => '$' + Math.round(Number(x || 0)).toLocaleString('es-CL');
const hoyISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fFecha = s => s ? String(s).slice(0, 10).split('-').reverse().join('-') + (String(s).length > 10 ? ' ' + String(s).slice(11, 16) : '') : '';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const ls = { get(k, d) { try { const v = localStorage.getItem('cf_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('cf_' + k, JSON.stringify(v)); } catch (e) { } }, del(k) { try { localStorage.removeItem('cf_' + k); } catch (e) { } } };

let S = ls.get('sesion', null); // {token, usuario, ...datos de inicio}
let pila = []; // historial de pantallas
const ROLES = { admin: 'Administración', bodega: 'Bodega', cocina: 'Cocina', atencion: 'Atención / servicio', chofer: 'Chofer' };

function toast(t, ms = 3200) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), ms); }
function cargando(on, txt) {
  let d = $('#cargando');
  if (on) { if (!d) { d = document.createElement('div'); d.id = 'cargando'; d.className = 'cargando'; document.body.appendChild(d); } d.innerHTML = '<div class="spin"></div><div>' + h(txt || 'Cargando…') + '</div>'; }
  else if (d) d.remove();
}

async function api(accion, datos = {}, opt = {}) {
  if (!API || API.indexOf('PEGA_AQUI') >= 0) throw new Error('Falta configurar el enlace del sistema en config.js');
  if (!opt.mudo) cargando(true, opt.txt);
  try {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion, token: S && S.token, ...datos }), redirect: 'follow' });
    const j = await res.json();
    if (!j.ok) {
      if (j.error === 'SESION') { salir(true); throw new Error('Tu sesión expiró. Vuelve a entrar.'); }
      const e = new Error(j.error); e.servidor = true; throw e;
    }
    return j.data;
  } catch (e) {
    if (!e.servidor && !/sesión/.test(e.message) && !/config\.js/.test(e.message)) e.red = true;
    throw e;
  } finally { if (!opt.mudo) cargando(false); }
}

/* Cola sin señal: recepciones, salidas y formularios se guardan en el teléfono y se envían solos. */
const cola = { get: () => ls.get('cola', []), set: c => { ls.set('cola', c); pintarCola(); } };
async function enviarOEncolar(accion, datos, desc) {
  datos.uid = datos.uid || uid();
  try { return await api(accion, datos, { txt: 'Enviando…' }); }
  catch (e) {
    if (!e.red) throw e;
    const c = cola.get(); c.push({ accion, datos, desc, t: Date.now() }); cola.set(c);
    return { enCola: true };
  }
}
let enviando = false;
async function vaciarCola() {
  if (enviando || !S) return; const c = cola.get(); if (!c.length) return;
  enviando = true; const quedan = [];
  for (const x of c) {
    try { const r = await api(x.accion, x.datos, { mudo: true }); if (r && r.stock) S.stock = r.stock; }
    catch (e) { if (e.red) quedan.push(x); else { quedan.push({ ...x, error: e.message }); } }
  }
  enviando = false; cola.set(quedan);
  if (c.length > quedan.length) toast('✅ Se enviaron ' + (c.length - quedan.length) + ' registros guardados sin señal');
}
function pintarCola() {
  const el = $('#colaBar'); if (!el) return; const c = cola.get();
  el.classList.toggle('oculto', !c.length);
  el.textContent = c.some(x => x.error) ? '⚠ Hay registros con error sin enviar. Toca para ver.' : '📶 ' + c.length + ' registro(s) guardados en el teléfono. Se enviarán con señal (toca para reintentar).';
}
window.addEventListener('online', vaciarCola);
setInterval(vaciarCola, 60000);

function ir(fn, ...args) { pila.push([fn, args]); fn(...args); window.scrollTo(0, 0); history.pushState({ n: pila.length }, ''); }
function atras() { if (pila.length > 1) { pila.pop(); const [fn, args] = pila[pila.length - 1]; fn(...args); window.scrollTo(0, 0); } else inicio(); }
window.addEventListener('popstate', () => { if (pila.length > 1) atras(); });
function pantalla(titulo, html, opts = {}) {
  const u = S.usuario;
  $('#app').innerHTML = `
  <header>
    ${opts.home ? `<img class="lg" src="${LOGO}" alt="Clean Food">` : `<button onclick="history.back()" aria-label="Volver">←</button><img class="mz" src="${MANZANA}" alt="">`}
    <div class="tit">${opts.home ? '' : `<b>${h(titulo)}</b>`}<small>${h(opts.sub || (u.nombre + ' · ' + (ROLES[u.rol] || u.rol)))}</small></div>
    ${opts.home ? '<button onclick="ir(perfil)">👤</button>' : '<button onclick="pila=[];inicio()">⌂</button>'}
  </header>
  <div id="colaBar" class="cola oculto" onclick="verCola()"></div>
  <main>${html}</main>
  ${opts.barra ? '<div class="barra"><div class="in">' + opts.barra + '</div></div>' : ''}`;
  pintarCola();
}
function verCola() {
  const c = cola.get();
  modal(`<h3>Pendientes de enviar</h3>${c.map((x, i) => `<div class="card"><b>${h(x.desc)}</b><br><small class="muted">${new Date(x.t).toLocaleString('es-CL')}</small>${x.error ? `<div class="aviso r">${h(x.error)}</div><button class="btn chico rojo" onclick="borrarCola(${i})">Descartar</button>` : ''}</div>`).join('')}
  <button class="btn full" onclick="cerrarModal();vaciarCola()">Reintentar ahora</button>`);
}
function borrarCola(i) { const c = cola.get(); c.splice(i, 1); cola.set(c); cerrarModal(); }
function modal(html) { cerrarModal(); const d = document.createElement('div'); d.className = 'modal'; d.id = 'modal'; d.innerHTML = '<div class="box">' + html + '</div>'; d.onclick = e => { if (e.target === d) cerrarModal(); }; document.body.appendChild(d); }
function cerrarModal() { const m = $('#modal'); if (m) m.remove(); }

function login() {

function marcar(b) {

function comprimir(file, max = 1280, q = .72) {
  return new Promise((ok, mal) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', q)); }; img.onerror = mal; img.src = fr.result; };
    fr.onerror = mal; fr.readAsDataURL(file);
  });
}
const FOTOS = {};

}
async function agregarFoto(id, inp) {

  inp.value = ''; $('#fotos-' + id).innerHTML = FOTOS[id].map((f, i) => `<img src="${f}" onclick="quitarFoto('${id}',${i})">`).join('');
}

const FIRMAS = {};
function firmaHTML(id) { return `<canvas class="firma" id="firma-${id}"></canvas><button type="button" class="btn gris chico" style="margin-top:6px" onclick="limpiarFirma('${id}')">Borrar firma</button>`; }
function activarFirma(id) {
  const c = $('#firma-' + id); if (!c) return;
  const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = r.width * dpr; c.height = r.height * dpr;
  const x = c.getContext('2d'); x.scale(dpr, dpr); x.lineWidth = 2.4; x.lineCap = 'round'; x.strokeStyle = '#17211B';
  let dib = false; FIRMAS[id] = false;
  const p = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => { dib = true; c.setPointerCapture(e.pointerId); x.beginPath(); x.moveTo(...p(e)); };
  c.onpointermove = e => { if (!dib) return; x.lineTo(...p(e)); x.stroke(); FIRMAS[id] = true; };
  c.onpointerup = c.onpointercancel = () => dib = false;
}
function limpiarFirma(id) { const c = $('#firma-' + id); c.getContext('2d').clearRect(0, 0, c.width, c.height); FIRMAS[id] = false; }
function leerFirma(id) {

  const c = $('#firma-' + id), o = document.createElement('canvas'); const k = Math.min(1, 600 / c.width);
  o.width = c.width * k; o.height = c.height * k; const x = o.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, o.width, o.height); x.drawImage(c, 0, 0, o.width, o.height);
  return o.toDataURL('image/jpeg', .8);
}

function marcarTemp(inp, min, max) {
  const v = inp.value === '' ? null : Number(inp.value);

function leerFormulario(f) {

      case 'aviso': return;
      case 'check': d[c.id] = leerChecklist('f_' + c.id); if (d[c.id].some(x => !x)) faltan.push(c.label); break;

      case 'foto': d[c.id] = FOTOS['f_' + c.id] || []; break;

/* Lectura del XML de la factura electrónica del SII (DTE) */
$('#xmlFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const txt = await leerTextoXML(file);
    const dte = parsearDTE(txt);
    leerCabecera();
    Object.assign(REC.cab, { proveedor: dte.prov, rut: dte.rut, tipo: dte.tipo, folio: dte.folio, fecha: dte.fecha || REC.cab.fecha, monto: dte.monto });
    REC.items = REC.items.filter(i => i.c || i.cant).concat(dte.items.map(x => emparejar(x, dte.rut)));
    ls.set('rec_borrador', REC); recepcion();
    const sinProd = REC.items.filter(i => !i.c).length;
    toast(`📄 ${dte.items.length} productos leídos de la ${dte.tipo.toLowerCase()} ${dte.folio}` + (sinProd ? `. Asigna ${sinProd} producto(s) sin emparejar.` : ''), 5000);
  } catch (err) { toast('No se pudo leer el XML: ' + err.message, 5000); }
});
async function leerTextoXML(file) {
  const buf = await file.arrayBuffer();
  const cab = new TextDecoder('ascii').decode(buf.slice(0, 200));
  const enc = /encoding=["']([\w-]+)/i.exec(cab);
  try { return new TextDecoder(enc ? enc[1] : 'utf-8').decode(buf); } catch (e) { return new TextDecoder('iso-8859-1').decode(buf); }
}
function parsearDTE(txt) {
  const doc = new DOMParser().parseFromString(txt, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('el archivo no es un XML válido');
  const t = (el, n) => { const x = el.getElementsByTagNameNS('*', n)[0] || el.getElementsByTagName(n)[0]; return x ? x.textContent.trim() : ''; };
  const docs = [...doc.getElementsByTagNameNS('*', 'Documento')].concat(doc.getElementsByTagNameNS('*', 'Documento').length ? [] : [...doc.getElementsByTagName('Documento')]);
  const D = docs[0]; if (!D) throw new Error('no se encontró un documento tributario (DTE)');
  const tipos = { 33: 'Factura', 34: 'Factura', 46: 'Factura', 52: 'Guía de despacho', 39: 'Boleta', 41: 'Boleta', 56: 'Factura', 61: 'Factura' };
  const tipoN = t(D, 'TipoDTE');
  if (tipoN === '61') toast('⚠ Este XML es una nota de crédito: revisa antes de ingresar', 5000);
  const items = [...D.getElementsByTagNameNS('*', 'Detalle')].map(d => {
    const q = Number(t(d, 'QtyItem')) || 1, monto = Number(t(d, 'MontoItem')) || 0;
    const pr = Number(t(d, 'PrcItem')) || (monto && q ? monto / q : 0);
    return { nf: t(d, 'NmbItem') || t(d, 'DscItem'), qf: q, uf: t(d, 'UnmdItem'), pf: Math.round(pr), cod: t(d, 'VlrCodigo') };
  }).filter(x => x.nf);
  return { tipo: tipos[tipoN] || 'Factura', folio: t(D, 'Folio'), fecha: t(D, 'FchEmis'), rut: t(D, 'RUTEmisor'), prov: t(D, 'RznSoc') || t(D, 'RznSocEmisor'), monto: t(D, 'MntTotal'), items };
}
const norm = s => String(s || '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
const normRut = r => String(r || '').toUpperCase().replace(/[^0-9K]/g, '');
function emparejar(x, rut) {
  const it = { ...x, cant: x.qf, costo: x.pf || '', f: 1, c: '' };
  const n = norm(x.nf), al = S.alias || [];
  const a = al.find(a => a.n === n && a.rut === normRut(rut)) || al.find(a => a.n === n);
  if (a && (S.productos || []).some(p => p.c === a.c)) { it.c = a.c; it.f = a.f || 1; it.cant = Math.round(x.qf * it.f * 1000) / 1000; it.costo = x.pf ? Math.round(x.pf / it.f) : ''; return it; }
  // sugerencia por palabras en común
  const pal = s => norm(s).split(/[^A-Z0-9]+/).filter(w => w.length > 2 && !/^\d+$/.test(w));
  const w = pal(x.nf); let mejor = null, pts = 0;
  (S.productos || []).forEach(p => { const pw = pal(p.n); const c = pw.filter(k => w.some(z => z.startsWith(k) || k.startsWith(z))).length / Math.max(pw.length, 1); if (c > pts) { pts = c; mejor = p; } });
  if (mejor && pts >= .5) { it.c = mejor.c; it.sug = true; }
  return it;
}

async function guardarRecepcion() {
  leerCabecera();
  const items = REC.items.filter(i => i.c && Number(i.cant) > 0);
  const sinProd = REC.items.filter(i => !i.c && (i.nf || i.cant)).length;
  if (sinProd) return toast(`Hay ${sinProd} línea(s) sin producto asignado. Asígnalo o quítalas.`, 4500);
  if (!items.length) return toast('Agrega al menos un producto');
  if (REC.check.some(x => !x)) return toast('Completa el checklist de recepción');
  if (!REC.cab.proveedor) return toast('Escribe el proveedor');
  const frios = items.some(i => /Refrig|Congel/.test(((S.productos || []).find(p => p.c === i.c) || {}).alm || ''));
  if (frios && REC.cab.temp === '' && !confirm('Hay productos refrigerados y no registraste la temperatura. ¿Continuar igual?')) return;
  const perecible = items.filter(i => !i.rechazado && !i.venc && /Refrig|Congel|Lácteo|Carne/.test(JSON.stringify((S.productos || []).find(p => p.c === i.c) || {})));
  if (perecible.length && !confirm(perecible.length + ' producto(s) perecibles sin fecha de vencimiento. ¿Continuar igual?')) return;
  const datos = {
    uid: REC.uid || (REC.uid = uid()), cab: REC.cab, fotos: FOTOS.rec || [],
    checklist: S.checkRecepcion.map((c, k) => ({ t: c.t, ok: c.ok, r: REC.check[k] })),
    items: items.map(i => ({ c: i.c, cant: Number(i.cant), venc: i.venc, lote: i.lote, costo: i.costo, rechazado: i.rechazado, motivo: i.motivo, nf: i.nf })),
    alias: items.filter(i => i.nf).map(i => ({ n: i.nf, c: i.c, f: Number(i.f) || 1 }))
  };
  try {
    const r = await enviarOEncolar('recepcion', datos, 'Recepción ' + (REC.cab.proveedor || '') + ' ' + (REC.cab.folio || ''));
    if (!r.enCola) {
      S.stock = r.stock;
      (datos.alias || []).forEach(a => { const n = norm(a.n); S.alias = (S.alias || []).filter(x => !(x.n === n && x.rut === normRut(REC.cab.rut))); S.alias.push({ n, rut: normRut(REC.cab.rut), c: a.c, f: a.f }); });
    }
    REC = null; ls.del('rec_borrador'); FOTOS.rec = [];
    if (r.enCola) return modal(`<h3>📶 Guardada en el teléfono</h3><p>Se ingresará a bodega cuando vuelva la señal.</p><button class="btn full" onclick="cerrarModal();pila=[];inicio()">Listo</button>`);
    ls.set('sesion', S);
    modal(`<h3>${r.resultado === 'Aceptada' ? '✅' : '⚠️'} Recepción ${h(r.resultado.toLowerCase())}</h3><p class="muted">${h(r.id)}</p>${r.observaciones.length ? '<div class="aviso">' + r.observaciones.map(h).join('<br>') + '</div>' : ''}<p>El stock ya está actualizado.</p><div class="row"><button class="btn sec" onclick="cerrarModal();pila=[[inicio,[]]];ir(stockVista)">Ver stock</button><button class="btn" onclick="cerrarModal();pila=[];inicio()">Listo</button></div>`);
  } catch (e) { toast(e.message, 5000); }
}

async function stockVista(recargar = true) {

function pintarStock() {
  if (!$('#st_lista')) return;

function claseDoc(d) { for (const k in S.config.tiposDoc) if (S.config.tiposDoc[k].includes(d.tipo)) return k; return d.titular === 'Empresa' ? 'Empresa' : 'Trabajador'; }
let DOCARCH = '';
function editarDoc(id) {
  const d = (S.documentos || []).find(x => x.id === id) || { tipo: '', titular: '', rut: '', detalle: '', emision: '', venc: '', obs: '', archivo: '' };
  const clase = id ? claseDoc(d) : 'Trabajador'; DOCARCH = '';
  modal(`<h3>${id ? 'Editar' : 'Nuevo'} documento</h3>
    <label class="l">¿De qué es?</label><div class="seg" id="dc_clase">${['Trabajador', 'Vehículo', 'Empresa'].map(c => `<button type="button" class="${c === clase ? 'on' : ''}" onclick="$$('#dc_clase button').forEach(b=>b.className='');this.className='on';tiposDoc()">${c}</button>`).join('')}</div>
    <label class="l">Tipo</label><div id="dc_tipo_w"></div>
    <div id="dc_tit_w"></div>
    <label class="l">Detalle <small>(institución, N° de resolución, faena…)</small></label><input id="dc_det" value="${h(d.detalle)}">
    <div class="row"><div><label class="l">Emisión</label><input id="dc_em" type="date" value="${h(d.emision)}"></div><div><label class="l">Vencimiento</label><input id="dc_ve" type="date" value="${h(d.venc)}"></div></div>
    <label class="l">Archivo <small>(PDF o foto)</small></label>${d.archivo ? `<p style="margin:0 0 6px"><a href="${h(d.archivo)}" target="_blank">Ver archivo actual</a></p>` : ''}<input type="file" id="dc_file" accept="application/pdf,image/*">
    <label class="l">Observaciones</label><input id="dc_obs" value="${h(d.obs)}">
    <div class="row" style="margin-top:16px">${id ? '<button class="btn rojo" id="dc_del">Eliminar</button>' : '<button class="btn gris" onclick="cerrarModal()">Cancelar</button>'}<button class="btn" id="dc_ok">Guardar</button></div>`);
  window.tiposDoc = () => {
    const c = $('#dc_clase .on').textContent;
    $('#dc_tipo_w').innerHTML = selectHTML('dc_tipo', S.config.tiposDoc[c], d.tipo);
    $('#dc_tit_w').innerHTML = c === 'Trabajador' ? `<label class="l">Trabajador</label><select id="dc_tit">${(S.trabajadores || []).map(t => `<option value="${h(t.rut)}" ${t.rut === d.rut ? 'selected' : ''}>${h(t.nombre)}</option>`).join('')}</select>`

  };

    const f = e.target.files[0]; if (!f) return;

  };
  const enviar = async borrar => {
    const c = $('#dc_clase .on').textContent, tsel = $('#dc_tit');
    const tr = c === 'Trabajador' && tsel ? (S.trabajadores || []).find(t => t.rut === tsel.value) : null;
    const nd = { id: d.id, tipo: $('#dc_tipo').value, titular: c === 'Empresa' ? 'Empresa' : c === 'Vehículo' ? 'Vehículo ' + (tsel ? tsel.value.toUpperCase() : '') : (tr ? tr.nombre : ''), rut: c === 'Empresa' ? '' : (tsel ? tsel.value.toUpperCase() : ''),
      detalle: $('#dc_det').value, emision: $('#dc_em').value, venc: $('#dc_ve').value, obs: $('#dc_obs').value, archivo: d.archivo, archivoNuevo: DOCARCH, borrar };
    if (!nd.tipo) return toast('Elige el tipo');
    if (c !== 'Empresa' && !nd.rut) return toast('Indica a quién pertenece');
    try { S.documentos = await api('documento', { d: nd }, { txt: 'Guardando…' }); cerrarModal(); documentosVista(false); toast('✅ Guardado'); } catch (e) { toast(e.message); }
  };
  $('#dc_ok').onclick = () => enviar(false);
  if ($('#dc_del')) $('#dc_del').onclick = () => confirm('¿Eliminar este documento?') && enviar(true);
}

async function trabajadoresVista() {
  pantalla('Trabajadores', '<div class="card lista" id="tr_l"><p class="muted">Cargando…</p></div>', { barra: `<button class="btn" onclick="editarTrab()">+ Agregar trabajador</button>` });
  try { TRABS = await api('trabajadores', {}, { mudo: true }); pintarTrabs(); } catch (e) { toast(e.message); }
}
let TRABS = [];
function pintarTrabs() {
  $('#tr_l').innerHTML = TRABS.map((t, i) => `<div class="it" onclick="editarTrab(${i})" style="${t.activo ? '' : 'opacity:.5'}"><div class="c"><b>${h(t.nombre)}</b><small>${h(t.rut)} · ${h(t.cargo)}${t.servicio ? ' · ' + h(t.servicio) : ''}</small></div><span class="badge b-g">${h(ROLES[t.rol] || t.rol)}</span></div>`).join('');
}
function editarTrab(i) {
  const t = i != null ? TRABS[i] : { rut: '', nombre: '', cargo: '', rol: 'cocina', servicio: '', tel: '', activo: true };
  modal(`<h3>${i != null ? 'Editar' : 'Nuevo'} trabajador</h3>
    <label class="l">RUT</label><input id="tr_rut" value="${h(t.rut)}" ${i != null ? 'disabled' : ''} placeholder="12.345.678-9">
    <label class="l">Nombre completo</label><input id="tr_nom" value="${h(t.nombre)}">
    <label class="l">Cargo</label><input id="tr_cargo" value="${h(t.cargo)}" placeholder="Cocinera, ayudante, chofer…">
    <label class="l">Qué ve en la app</label><select id="tr_rol">${Object.keys(ROLES).map(r => `<option value="${r}" ${r === t.rol ? 'selected' : ''}>${ROLES[r]}</option>`).join('')}</select>
    <p class="muted" style="font-size:13px;margin:6px 0 0">Cocina y Atención: control del manipulador, temperaturas, limpieza, raciones. Chofer: checklist del vehículo. Bodega: recepción, salidas y stock. Administración: todo.</p>
    <label class="l">Servicio habitual</label>${selectHTML('tr_serv', S.config.servicios, t.servicio, '—')}
    <label class="l">Teléfono</label><input id="tr_tel" value="${h(t.tel)}" inputmode="tel">
    ${i != null ? `<label style="display:flex;gap:8px;margin-top:12px"><input type="checkbox" id="tr_act" style="width:auto" ${t.activo ? 'checked' : ''}> Activo (puede entrar)</label><label style="display:flex;gap:8px;margin-top:8px"><input type="checkbox" id="tr_reset" style="width:auto"> Reiniciar PIN (vuelve a los 4 primeros números del RUT)</label>` : '<p class="muted" style="font-size:13px">Su PIN inicial serán los 4 primeros números del RUT.</p>'}
    <div class="row" style="margin-top:16px"><button class="btn gris" onclick="cerrarModal()">Cancelar</button><button class="btn" id="tr_ok">Guardar</button></div>`);
  $('#tr_ok').onclick = async () => {
    const d = { rut: $('#tr_rut').value.trim(), nombre: $('#tr_nom').value.trim(), cargo: $('#tr_cargo').value.trim(), rol: $('#tr_rol').value, servicio: $('#tr_serv').value, tel: $('#tr_tel').value.trim(), activo: i == null || $('#tr_act').checked, resetPin: i != null && $('#tr_reset').checked };
    if (!d.rut || !d.nombre) return toast('RUT y nombre son obligatorios');
    if (i == null && !rutValido(d.rut)) return toast('El RUT no es válido (revisa el dígito verificador)');
    try { TRABS = await api('trabajador', { t: d }); S.trabajadores = TRABS.map(x => ({ rut: x.rut, nombre: x.nombre })); cerrarModal(); pintarTrabs(); toast('✅ Guardado'); } catch (e) { toast(e.message); }
  };
}
function rutValido(r) { const c = normRut(r); if (c.length < 2) return false; const cu = c.slice(0, -1), dv = c.slice(-1); let s = 0, m = 2; for (let i = cu.length - 1; i >= 0; i--) { s += Number(cu[i]) * m; m = m === 7 ? 2 : m + 1; } const e = 11 - s % 11; return dv === (e === 11 ? '0' : e === 10 ? 'K' : String(e)); }

function configVista() {
  const c = S.configCompleta || {};
  const campo = (k, lab, ayuda, area = true) => `<label class="l">${h(lab)}${ayuda ? ' <small>· ' + h(ayuda) + '</small>' : ''}</label>${area ? `<textarea data-cfg="${k}">${h(c[k] || '')}</textarea>` : `<input data-cfg="${k}" value="${h(c[k] || '')}">`}`;
  pantalla('Configuración', `<div class="card">
    ${campo('empresa', 'Nombre de la empresa', '', false)}
    ${campo('correo_alertas', 'Correo(s) que reciben las alertas', 'separados por coma', false)}
    ${campo('bodegas', 'Bodegas', 'separadas por coma; la primera es la central')}
    ${campo('servicios', 'Servicios, casinos y clientes', 'separados por coma')}
    ${campo('motivos_salida', 'Motivos de salida', 'separados por coma')}
    ${campo('equipos_frio', 'Equipos de frío', 'Nombre|mín|máx, separados por coma')}
    ${campo('vehiculos', 'Patentes de vehículos', 'separadas por coma', false)}
    <div class="row"><div>${campo('dias_aviso_venc', 'Avisar vencimiento de productos', 'días antes', false)}</div><div>${campo('dias_aviso_docs', 'Avisar vencimiento de documentos', 'días antes', false)}</div></div>
    ${campo('color', 'Color de la app', 'ej: #1F7A4D', false)}
    <div class="aviso" style="margin-top:14px">Si cambias el nombre de una bodega, el stock ya registrado queda con el nombre anterior. Mejor agrega bodegas nuevas al final.</div>
  </div>`, { barra: `<button class="btn" onclick="guardarConfig()">Guardar</button>` });
}
async function guardarConfig() {
  const cfg = {}; $$('[data-cfg]').forEach(el => cfg[el.dataset.cfg] = el.value.trim().replace(/\s*\n\s*/g, ', '));
  try { await api('config', { config: cfg }); await refrescar(); toast('✅ Configuración guardada'); pila = []; inicio(); } catch (e) { toast(e.message); }
}

/* ═════════════════════ Arranque ═════════════════════ */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
if (S && S.token) { pila = []; inicio(); vaciarCola(); } else login();
</script>
</body>
