<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clean Food · Bodega y Prevención</title>
<meta name="theme-color" content="#1F7A4D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<style>
:root{--v:#1F7A4D;--v2:#E8F4EC;--t:#17211B;--g:#5E6B63;--b:#DDE5E0;--f:#F5F7F5;--r:#C62828;--r2:#FDECEA;--a:#B26A00;--a2:#FFF4E0;--ok:#2E7D32;--w:#fff;--rad:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--f);color:var(--t);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--v);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header .tit{flex:1;min-width:0}
header .tit b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .tit small{opacity:.85;font-size:13px}
header button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;padding:8px 11px;font-size:15px}
main{max-width:860px;margin:0 auto;padding:14px 14px 110px}
h2{font-size:15px;color:var(--g);text-transform:uppercase;letter-spacing:.04em;margin:22px 2px 10px}
h3{margin:0 0 8px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--w);border:1px solid var(--b);border-radius:var(--rad);padding:14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:92px}
.tile .i{font-size:26px}
.tile b{font-size:15px;line-height:1.2}
.tile small{color:var(--g);font-size:12.5px}
.tile.dest{background:var(--v);color:#fff;border-color:var(--v)}
.tile.dest small{color:#d7eee0}
.card{background:var(--w);border:1px solid var(--b);border-radius:var(--rad);padding:14px;margin-bottom:12px}
label.l{display:block;font-weight:600;font-size:14.5px;margin:12px 0 5px}
label.l small{font-weight:400;color:var(--g)}
input,select,textarea{width:100%;border:1px solid #C9D3CD;border-radius:10px;padding:11px 12px;background:#fff;font-size:16px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--v);border-color:var(--v)}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:13px 16px;background:var(--v);color:#fff;font-weight:600;cursor:pointer;font-size:16px}
.btn.sec{background:var(--v2);color:var(--v)}
.btn.gris{background:#EEF1EF;color:var(--t)}
.btn.rojo{background:var(--r2);color:var(--r)}
.btn.chico{padding:8px 11px;font-size:14px;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.barra{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--b);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:6}
.barra .in{max-width:860px;margin:0 auto;display:flex;gap:8px}
.barra .btn{flex:1}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid #C9D3CD;background:#fff;border-radius:10px;padding:8px 14px;min-width:54px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--v);border-color:var(--v);color:#fff}
.seg button.on.mal{background:var(--r);border-color:var(--r)}
.ck{padding:10px 0;border-bottom:1px solid #EEF1EF}
.ck:last-child{border-bottom:0}
.ck p{margin:0 0 7px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid #C9D3CD;background:#fff;border-radius:20px;padding:8px 12px;font-size:14px;cursor:pointer;text-align:left}
.chip.on{background:var(--v2);border-color:var(--v);color:var(--v);font-weight:600}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12.5px;font-weight:700;white-space:nowrap}
.b-ok{background:#E3F2E7;color:var(--ok)}.b-r{background:var(--r2);color:var(--r)}.b-a{background:var(--a2);color:var(--a)}.b-g{background:#EEF1EF;color:var(--g)}
.aviso{background:var(--a2);border:1px solid #F3D19C;color:#6B4300;border-radius:12px;padding:12px;margin:10px 0;font-size:14.5px}
.aviso.r{background:var(--r2);border-color:#F2B8B5;color:#7F1D1D}
.aviso.v{background:var(--v2);border-color:#BFDCC9;color:#174D33}
.lista .it{display:flex;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid #EEF1EF}
.lista .it:last-child{border-bottom:0}
.lista .it .c{flex:1;min-width:0}
.lista .it .c b{display:block;font-size:15px}
.lista .it .c small{color:var(--g);font-size:13px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.num b{font-size:17px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--w);border:1px solid var(--b);border-radius:var(--rad);padding:12px}
.kpi small{color:var(--g);font-size:12.5px;display:block}
.kpi b{font-size:22px}
.item{border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px;background:#FBFCFB}
.item.rech{background:var(--r2);border-color:#F2B8B5}
.item .fac{font-size:13px;color:var(--g);margin-bottom:6px;background:#EEF1EF;border-radius:8px;padding:6px 8px}
.item .sug{color:var(--a);font-size:12.5px;font-weight:600}
.x{flex:0 0 auto!important;background:none;border:0;font-size:20px;color:var(--g);cursor:pointer;padding:2px 6px}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.fotos img{width:78px;height:78px;object-fit:cover;border-radius:10px;border:1px solid var(--b)}
.firma{border:1.5px dashed #9FB0A6;border-radius:12px;background:#fff;width:100%;height:170px;touch-action:none;display:block}
.tabla{width:100%;border-collapse:collapse;font-size:14px}
.tabla th,.tabla td{padding:8px 6px;border-bottom:1px solid #EEF1EF;text-align:left;vertical-align:top}
.tabla th{font-size:12.5px;color:var(--g);font-weight:600}
.scroll{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#17211B;color:#fff;padding:12px 18px;border-radius:12px;z-index:50;max-width:90vw;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:18px}}
.cargando{position:fixed;inset:0;background:rgba(245,247,245,.75);z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--g)}
.spin{width:38px;height:38px;border:4px solid var(--v2);border-top-color:var(--v);border-radius:50%;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.login{max-width:380px;margin:9vh auto 0;padding:0 18px}
.logo{width:76px;height:76px;border-radius:20px;background:var(--v);display:flex;align-items:center;justify-content:center;color:#fff;font-size:38px;margin:0 auto 14px}
.centro{text-align:center}
.muted{color:var(--g);font-size:14px}
.cola{background:var(--a2);color:#6B4300;padding:9px 14px;font-size:14px;text-align:center;cursor:pointer}
.oculto{display:none!important}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filtros>*{flex:1;min-width:130px}
a{color:var(--v)}
</style>
</head>
<body>
<div id="app"></div>
<datalist id="dl-prod"></datalist>
<datalist id="dl-prov"></datalist>
<input type="file" id="xmlFile" accept=".xml,text/xml,application/xml" class="oculto">

<script>
'use strict';
/* ═════════════════════ Núcleo ═════════════════════ */
const API = (window.CLEANFOOD_API || '').trim();
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n0 = x => Number(x || 0).toLocaleString('es-CL', { maximumFractionDigits: 3 });
const peso = x => '$' + Math.round(Number(x || 0)).toLocaleString('es-CL');
const hoyISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fFecha = s => s ? String(s).slice(0, 10).split('-').reverse().join('-') + (String(s).length > 10 ? ' ' + String(s).slice(11, 16) : '') : '';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const ls = { get(k, d) { try { const v = localStorage.getItem('cf_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('cf_' + k, JSON.stringify(v)); } catch (e) { } }, del(k) { try { localStorage.removeItem('cf_' + k); } catch (e) { } } };

let S = ls.get('sesion', null); // {token, usuario, ...datos de inicio}
let pila = []; // historial de pantallas
const ROLES = { admin: 'Administración', bodega: 'Bodega', cocina: 'Cocina', atencion: 'Atención / servicio', chofer: 'Chofer' };

function toast(t, ms = 3200) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), ms); }
function cargando(on, txt) {
  let d = $('#cargando');
  if (on) { if (!d) { d = document.createElement('div'); d.id = 'cargando'; d.className = 'cargando'; document.body.appendChild(d); } d.innerHTML = '<div class="spin"></div><div>' + h(txt || 'Cargando…') + '</div>'; }
  else if (d) d.remove();
}

async function api(accion, datos = {}, opt = {}) {
  if (!API || API.indexOf('PEGA_AQUI') >= 0) throw new Error('Falta configurar el enlace del sistema en config.js');
  if (!opt.mudo) cargando(true, opt.txt);
  try {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion, token: S && S.token, ...datos }), redirect: 'follow' });
    const j = await res.json();
    if (!j.ok) {
      if (j.error === 'SESION') { salir(true); throw new Error('Tu sesión expiró. Vuelve a entrar.'); }
      const e = new Error(j.error); e.servidor = true; throw e;
    }
    return j.data;
  } catch (e) {
    if (!e.servidor && !/sesión/.test(e.message) && !/config\.js/.test(e.message)) e.red = true;
    throw e;
  } finally { if (!opt.mudo) cargando(false); }
}

/* Cola sin señal: recepciones, salidas y formularios se guardan en el teléfono y se envían solos. */
const cola = { get: () => ls.get('cola', []), set: c => { ls.set('cola', c); pintarCola(); } };
async function enviarOEncolar(accion, datos, desc) {
  datos.uid = datos.uid || uid();
  try { return await api(accion, datos, { txt: 'Enviando…' }); }
  catch (e) {
    if (!e.red) throw e;
    const c = cola.get(); c.push({ accion, datos, desc, t: Date.now() }); cola.set(c);
    return { enCola: true };
  }
}
let enviando = false;
async function vaciarCola() {
  if (enviando || !S) return; const c = cola.get(); if (!c.length) return;
  enviando = true; const quedan = [];
  for (const x of c) {
    try { const r = await api(x.accion, x.datos, { mudo: true }); if (r && r.stock) S.stock = r.stock; }
    catch (e) { if (e.red) quedan.push(x); else { quedan.push({ ...x, error: e.message }); } }
  }
  enviando = false; cola.set(quedan);
  if (c.length > quedan.length) toast('✅ Se enviaron ' + (c.length - quedan.length) + ' registros guardados sin señal');
}
function pintarCola() {
  const el = $('#colaBar'); if (!el) return; const c = cola.get();
  el.classList.toggle('oculto', !c.length);
  el.textContent = c.some(x => x.error) ? '⚠ Hay registros con error sin enviar. Toca para ver.' : '📶 ' + c.length + ' registro(s) guardados en el teléfono. Se enviarán con señal (toca para reintentar).';
}
window.addEventListener('online', vaciarCola);
setInterval(vaciarCola, 60000);

/* ═════════════════════ Navegación ═════════════════════ */
function ir(fn, ...args) { pila.push([fn, args]); fn(...args); window.scrollTo(0, 0); history.pushState({ n: pila.length }, ''); }
function atras() { if (pila.length > 1) { pila.pop(); const [fn, args] = pila[pila.length - 1]; fn(...args); window.scrollTo(0, 0); } else inicio(); }
window.addEventListener('popstate', () => { if (pila.length > 1) atras(); });
function pantalla(titulo, html, opts = {}) {
  const u = S.usuario;
  $('#app').innerHTML = `
  <header>
    ${opts.home ? '<div style="font-size:26px">🥗</div>' : '<button onclick="history.back()" aria-label="Volver">←</button>'}
    <div class="tit"><b>${h(titulo)}</b><small>${h(opts.sub || (u.nombre + ' · ' + (ROLES[u.rol] || u.rol)))}</small></div>
    ${opts.home ? '<button onclick="ir(perfil)">👤</button>' : '<button onclick="pila=[];inicio()">⌂</button>'}
  </header>
  <div id="colaBar" class="cola oculto" onclick="verCola()"></div>
  <main>${html}</main>
  ${opts.barra ? '<div class="barra"><div class="in">' + opts.barra + '</div></div>' : ''}`;
  pintarCola();
}
function verCola() {
  const c = cola.get();
  modal(`<h3>Pendientes de enviar</h3>${c.map((x, i) => `<div class="card"><b>${h(x.desc)}</b><br><small class="muted">${new Date(x.t).toLocaleString('es-CL')}</small>${x.error ? `<div class="aviso r">${h(x.error)}</div><button class="btn chico rojo" onclick="borrarCola(${i})">Descartar</button>` : ''}</div>`).join('')}
  <button class="btn full" onclick="cerrarModal();vaciarCola()">Reintentar ahora</button>`);
}
function borrarCola(i) { const c = cola.get(); c.splice(i, 1); cola.set(c); cerrarModal(); }
function modal(html) { cerrarModal(); const d = document.createElement('div'); d.className = 'modal'; d.id = 'modal'; d.innerHTML = '<div class="box">' + html + '</div>'; d.onclick = e => { if (e.target === d) cerrarModal(); }; document.body.appendChild(d); }
function cerrarModal() { const m = $('#modal'); if (m) m.remove(); }

/* ═════════════════════ Ingreso ═════════════════════ */
function login() {
  $('#app').innerHTML = `<div class="login">
    <div class="logo">🥗</div>
    <h2 class="centro" style="text-transform:none;font-size:22px;color:var(--t);letter-spacing:0;margin:0 0 4px">Clean Food</h2>
    <p class="centro muted" style="margin:0 0 24px">Bodega · Inocuidad · Prevención</p>
    <div class="card">
      <label class="l">RUT</label><input id="rut" autocomplete="username" placeholder="12.345.678-9" value="${h(ls.get('ultRut', ''))}">
      <label class="l">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••">
      <button class="btn full" style="margin-top:16px" onclick="entrar()">Entrar</button>
      <p class="muted centro" style="margin:12px 0 0;font-size:13px">La primera vez tu PIN son los 4 primeros números de tu RUT.</p>
    </div></div>`;
  $('#pin').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
}
async function entrar() {
  const rut = $('#rut').value.trim(), pin = $('#pin').value.trim();
  if (!rut || !pin) return toast('Escribe tu RUT y PIN');
  try { S = await api('login', { rut, pin }, { txt: 'Entrando…' }); ls.set('sesion', S); ls.set('ultRut', rut); pila = []; inicio(); vaciarCola(); }
  catch (e) { toast(e.red ? 'Sin conexión. Para entrar la primera vez necesitas señal.' : e.message); }
}
function salir(silencioso) { S = null; ls.del('sesion'); pila = []; login(); if (!silencioso) toast('Sesión cerrada'); }

async function refrescar(mudo) {
  try { const d = await api('inicio', {}, { mudo }); S = { ...S, ...d }; ls.set('sesion', S); prepararListas(); return true; }
  catch (e) { if (!mudo) toast(e.red ? 'Sin señal: se muestran los últimos datos guardados' : e.message); return false; }
}
function prepararListas() {
  if (!S) return;
  document.documentElement.style.setProperty('--v', S.config.color || '#1F7A4D');
  $('#dl-prod').innerHTML = (S.productos || []).map(p => `<option value="${h(p.n + ' · ' + p.c)}">`).join('');
  $('#dl-prov').innerHTML = (S.proveedores || []).map(p => `<option value="${h(p.nombre)}">${h(p.rut)}</option>`).join('');
}
const esAdmin = () => S.usuario.rol === 'admin';
const esBodega = () => S.usuario.rol === 'admin' || S.usuario.rol === 'bodega';
const prodDe = txt => { const m = String(txt || '').match(/·\s*([A-Z]{2,4}-\d+)\s*$/); return m ? (S.productos || []).find(p => p.c === m[1]) : (S.productos || []).find(p => p.n.toUpperCase() === String(txt || '').trim().toUpperCase()); };
const etiquetaProd = p => p ? p.n + ' · ' + p.c : '';

/* ═════════════════════ Inicio ═════════════════════ */
function inicio() {
  if (!S) return login();
  if (!pila.length) pila = [[inicio, []]];
  prepararListas();
  const u = S.usuario, f = S.forms || [];
  const grupos = {};
  f.forEach(x => (grupos[x.grupo] = grupos[x.grupo] || []).push(x));
  const tile = (onclick, i, t, s, cls = '') => `<button class="tile ${cls}" onclick="${onclick}"><span class="i">${i}</span><b>${h(t)}</b>${s ? '<small>' + h(s) + '</small>' : ''}</button>`;
  const docsMal = (S.misDocumentos || []).filter(d => d.estado === 'Vencido' || d.estado === 'Por vencer');
  let html = `<p style="margin:2px 2px 0">Hola, <b>${h(u.nombre.split(' ')[0])}</b> 👋</p>`;
  if (docsMal.length) html += `<div class="aviso">${docsMal.map(d => `⏰ <b>${h(d.tipo)}</b>: ${d.dv < 0 ? 'vencido el ' : 'vence el '}${fFecha(d.venc)}`).join('<br>')}</div>`;
  if (esBodega()) {
    html += `<h2>Bodega y stock</h2><div class="grid">
      ${tile("ir(recepcion)", '📥', 'Recepción de mercadería', 'Factura o guía + checklist', 'dest')}
      ${tile("ir(salida,'')", '📤', 'Salida de bodega', 'Consumo, despacho, merma')}
      ${tile("ir(stockVista)", '📦', 'Stock en línea', 'Por bodega y vencimientos')}
      ${tile("ir(salida,'traspaso')", '🔁', 'Traspaso entre bodegas', 'Ej: central → Take a Food')}
      ${esAdmin() ? tile("ir(inventario)", '🧮', 'Inventario físico', 'Contar y cuadrar') : ''}
      ${tile("ir(productosVista)", '🏷️', 'Productos', 'Crear y editar')}
    </div>`;
  }
  const ordenG = ['Inocuidad', 'Servicio', 'Prevención'];
  Object.keys(grupos).sort((a, b) => ordenG.indexOf(a) - ordenG.indexOf(b)).forEach(g => {
    html += `<h2>${h(g === 'Inocuidad' ? 'Inocuidad y cocina' : g === 'Servicio' ? 'Servicio' : 'Prevención de riesgos')}</h2><div class="grid">${grupos[g].map(x => tile(`ir(formulario,'${x.id}')`, x.icono, x.titulo, '')).join('')}</div>`;
  });
  if (esAdmin()) {
    html += `<h2>Administración</h2><div class="grid">
      ${tile("ir(resumenVista)", '📊', 'Resumen del día', 'Alertas y registros', 'dest')}
      ${tile("ir(registrosVista)", '🗂️', 'Registros', 'Formularios enviados')}
      ${tile("ir(movimientosVista)", '📒', 'Movimientos', 'Entradas y salidas')}
      ${tile("ir(recepcionesVista)", '🧾', 'Recepciones', 'Facturas recibidas')}
      ${tile("ir(documentosVista)", '📑', 'Permisos y cursos', 'Sanitarios, vehículos, faena')}
      ${tile("ir(trabajadoresVista)", '👥', 'Trabajadores', 'Accesos y cargos')}
      ${tile("ir(configVista)", '⚙️', 'Configuración', 'Bodegas, servicios, equipos')}
      ${tile("abrirPlanilla()", '📗', 'Abrir planilla', 'Google Sheets')}
    </div>`;
  }
  html += `<h2>Mi cuenta</h2><div class="grid">${tile("ir(perfil)", '👤', 'Mi perfil', 'Mis registros, cursos y PIN')}</div>
  <p class="muted centro" style="margin-top:26px;font-size:12px">${h(S.config.empresa)} · ${h(S.version || '')}</p>`;
  pantalla(S.config.empresa, html, { home: true });
  refrescarSilencioso();
}
let ultRefresco = 0;

function comprimir(file, max = 1280, q = .72) {
  return new Promise((ok, mal) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', q)); }; img.onerror = mal; img.src = fr.result; };
    fr.onerror = mal; fr.readAsDataURL(file);
  });
}

const FIRMAS = {};
function firmaHTML(id) { return `<canvas class="firma" id="firma-${id}"></canvas><button type="button" class="btn gris chico" style="margin-top:6px" onclick="limpiarFirma('${id}')">Borrar firma</button>`; }
function activarFirma(id) {
  const c = $('#firma-' + id); if (!c) return;
  const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = r.width * dpr; c.height = r.height * dpr;
  const x = c.getContext('2d'); x.scale(dpr, dpr); x.lineWidth = 2.4; x.lineCap = 'round'; x.strokeStyle = '#17211B';
  let dib = false; FIRMAS[id] = false;
  const p = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => { dib = true; c.setPointerCapture(e.pointerId); x.beginPath(); x.moveTo(...p(e)); };
  c.onpointermove = e => { if (!dib) return; x.lineTo(...p(e)); x.stroke(); FIRMAS[id] = true; };
  c.onpointerup = c.onpointercancel = () => dib = false;
}

/* Lectura del XML de la factura electrónica del SII (DTE) */
$('#xmlFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const txt = await leerTextoXML(file);
    const dte = parsearDTE(txt);
    leerCabecera();
    Object.assign(REC.cab, { proveedor: dte.prov, rut: dte.rut, tipo: dte.tipo, folio: dte.folio, fecha: dte.fecha || REC.cab.fecha, monto: dte.monto });
    REC.items = REC.items.filter(i => i.c || i.cant).concat(dte.items.map(x => emparejar(x, dte.rut)));
    ls.set('rec_borrador', REC); recepcion();
    const sinProd = REC.items.filter(i => !i.c).length;
    toast(`📄 ${dte.items.length} productos leídos de la ${dte.tipo.toLowerCase()} ${dte.folio}` + (sinProd ? `. Asigna ${sinProd} producto(s) sin emparejar.` : ''), 5000);
  } catch (err) { toast('No se pudo leer el XML: ' + err.message, 5000); }
});
async function leerTextoXML(file) {
  const buf = await file.arrayBuffer();
  const cab = new TextDecoder('ascii').decode(buf.slice(0, 200));
  const enc = /encoding=["']([\w-]+)/i.exec(cab);
  try { return new TextDecoder(enc ? enc[1] : 'utf-8').decode(buf); } catch (e) { return new TextDecoder('iso-8859-1').decode(buf); }
}
function parsearDTE(txt) {
  const doc = new DOMParser().parseFromString(txt, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('el archivo no es un XML válido');
  const t = (el, n) => { const x = el.getElementsByTagNameNS('*', n)[0] || el.getElementsByTagName(n)[0]; return x ? x.textContent.trim() : ''; };
  const docs = [...doc.getElementsByTagNameNS('*', 'Documento')].concat(doc.getElementsByTagNameNS('*', 'Documento').length ? [] : [...doc.getElementsByTagName('Documento')]);
  const D = docs[0]; if (!D) throw new Error('no se encontró un documento tributario (DTE)');
  const tipos = { 33: 'Factura', 34: 'Factura', 46: 'Factura', 52: 'Guía de despacho', 39: 'Boleta', 41: 'Boleta', 56: 'Factura', 61: 'Factura' };
  const tipoN = t(D, 'TipoDTE');
  if (tipoN === '61') toast('⚠ Este XML es una nota de crédito: revisa antes de ingresar', 5000);
  const items = [...D.getElementsByTagNameNS('*', 'Detalle')].map(d => {
    const q = Number(t(d, 'QtyItem')) || 1, monto = Number(t(d, 'MontoItem')) || 0;
    const pr = Number(t(d, 'PrcItem')) || (monto && q ? monto / q : 0);
    return { nf: t(d, 'NmbItem') || t(d, 'DscItem'), qf: q, uf: t(d, 'UnmdItem'), pf: Math.round(pr), cod: t(d, 'VlrCodigo') };
  }).filter(x => x.nf);
  return { tipo: tipos[tipoN] || 'Factura', folio: t(D, 'Folio'), fecha: t(D, 'FchEmis'), rut: t(D, 'RUTEmisor'), prov: t(D, 'RznSoc') || t(D, 'RznSocEmisor'), monto: t(D, 'MntTotal'), items };
}
const norm = s => String(s || '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
const normRut = r => String(r || '').toUpperCase().replace(/[^0-9K]/g, '');
function emparejar(x, rut) {
  const it = { ...x, cant: x.qf, costo: x.pf || '', f: 1, c: '' };
  const n = norm(x.nf), al = S.alias || [];
  const a = al.find(a => a.n === n && a.rut === normRut(rut)) || al.find(a => a.n === n);
  if (a && (S.productos || []).some(p => p.c === a.c)) { it.c = a.c; it.f = a.f || 1; it.cant = Math.round(x.qf * it.f * 1000) / 1000; it.costo = x.pf ? Math.round(x.pf / it.f) : ''; return it; }
  // sugerencia por palabras en común
  const pal = s => norm(s).split(/[^A-Z0-9]+/).filter(w => w.length > 2 && !/^\d+$/.test(w));
  const w = pal(x.nf); let mejor = null, pts = 0;
  (S.productos || []).forEach(p => { const pw = pal(p.n); const c = pw.filter(k => w.some(z => z.startsWith(k) || k.startsWith(z))).length / Math.max(pw.length, 1); if (c > pts) { pts = c; mejor = p; } });
  if (mejor && pts >= .5) { it.c = mejor.c; it.sug = true; }
  return it;
}

async function guardarRecepcion() {

  if (!items.length) return toast('Agrega al menos un producto');
  if (REC.check.some(x => !x)) return toast('Completa el checklist de recepción');

  const datos = {

function stockDe(b, c) { return (S.stock || []).find(s => s.b === b && s.c === c); }
function pintarSal() {
  const b = $('#s_bodega').value;
  $('#sitems').innerHTML = SAL.items.map((it, i) => {

function leerSal() {

async function guardarSalida() {
